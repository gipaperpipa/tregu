  const groups = [
    ["Read from the statements",
     "Proven only where the statement's own arithmetic closed.",
     [["rev","Revenue"], ["np","Net profit"], ["ta","Total assets"], ["te","Equity"]]],
    ["Derived ratios",
     "A ratio needs both its inputs proven, so coverage compounds downwards.",
     [["gm","Gross margin"], ["nm","Net margin"], ["roa","Return on assets"],
      ["roe","Return on equity"], ["lev","Liabilities / assets"], ["at","Asset turnover"]]],
    ["Cash flow",
     "The thinnest group: the cash reconciliation has to close before any of it is accepted.",
     [["ocfm","Op. cash margin"], ["ocfa","Op. cash / assets"], ["conv","Cash conversion"]]],
    ["Needs two years", "One filing yields no growth figure at all.",
     [["g","Revenue growth"], ["cagr","Revenue CAGR"]]],
    ["From the registry",
     "An unmatched filer carries no sector, so it cannot be benchmarked.",
     [["e","Staff"], ["s","Sector"], ["c","City"]]],
  ];
  const twins = DATA.filter(r => r.tw).length;
  const twinYears = DATA.filter(r => r.twy).length;
  const bar = (label, count, fill) => {
    const share = count / n * 100;
    return el("div", { class:"qbar" },
      el("div", { class:"qtop" },
        el("span", { class:"qlabel", text:label }),
        el("span", { class:"qnum",
          text: fmt.format(count) + " · " + share.toFixed(0) + "%" })),
      el("div", { class:"qtrack", "aria-hidden":"true" },
        el("div", { style:"width:" + Math.max(share, 0.4).toFixed(2) + "%;background:"
                          + (fill || (share >= 66 ? POS : share >= 33 ? "#999999" : NEG)) })));
  };

  const panels = el("div", { class:"panelrow" });
  for (const g of groups) {
    const panel = el("div", { class:"panel" }, el("h3", { class:"cap", text:g[0] }));
    const bars = el("div", { class:"qbars" });
    for (const f of g[2]) {
      bars.append(bar(f[1], pool.filter(r => r[f[0]] != null && r[f[0]] !== "").length));
    }
    panel.append(bars);
    panel.append(el("p", { class:"note", text:g[1] }));
    panels.append(panel);
  }

  const filings = {};
  for (const r of pool) {
    const b = r.ny >= 4 ? "4 or more" : String(r.ny || 0);
    filings[b] = (filings[b] || 0) + 1;
  }
  const fpanel = el("div", { class:"panel" },
    el("h3", { class:"cap", text:"Filings read per company" }));
  const fbars = el("div", { class:"qbars" });
  for (const k of Object.keys(filings).sort()) {
    fbars.append(bar(k === "1" ? "1 filing" : k + " filings", filings[k], SERIES));
  }
  fpanel.append(fbars);
  fpanel.append(el("p", { class:"note",
    text:"Read from the Ministry of Finance archive; more filings means more years to "
       + "compare." }));
  panels.append(fpanel);

  /* Which fiscal year is worth standing on. The archive is still filling in for
     the most recent year, so the newest column is not the fullest one — the
     by-year view is only as good as the year it is pointed at. */
  const ypanel = el("div", { class:"panel" },
    el("h3", { class:"cap", text:"Companies filing, by fiscal year" }));
  const ybars = el("div", { class:"qbars" });
  const counts = YEARS.map(y => [y, pool.filter(r => r.fy && r.fy[String(y)]).length]);
  const fullest = counts.reduce((a, c) => c[1] > a[1] ? c : a, [null, 0]);
  for (const [y, count] of counts) {
    ybars.append(bar("FY " + y, count, y === fullest[0] ? POS : SERIES));
  }
  ypanel.append(ybars);
  /* Two different questions with two different answers, so both are named
     rather than one superlative standing in for the other: these bars count a
     company that proved anything for the year, and the screener's spine is
     revenue, which peaks a year earlier. */
  const revBest = YEARS.map(y => [y, pool.filter(r =>
      r.fy && r.fy[String(y)] && r.fy[String(y)].rev != null).length])
    .reduce((a, c) => c[1] > a[1] ? c : a, [null, 0]);
  ypanel.append(el("p", { class:"note",
    text:"Filings for a year keep arriving after it ends, so the newest column is never the "
       + "fullest. FY " + fullest[0] + " has the most companies on record; revenue in "
       + "particular is proven for most companies in FY " + revBest[0] + " ("
       + fmt.format(revBest[1]) + "). Pick a year from this, not from the calendar." }));
  panels.append(ypanel);
  wrap.append(panels);

  wrap.append(el("p", { class:"foot",
    text:"Of the " + fmt.format(DATA.filter(r => r.u).length) + " unmatched filers, "
       + fmt.format(twins) + " file under the same name as a registry-matched company "
       + "once spelling and legal form are set aside, and " + fmt.format(twinYears)
       + " of those publish a fiscal year their twin also publishes. With unmatched "
       + "filers included, those years are on the page twice, from two different "
       + "filings. They are flagged on the row rather than merged: a name is not proof "
       + "of identity, and a wrong merge loses a company where a duplicate only repeats "
       + "one. Nothing here measures whether a proven figure is right — only whether it "
       + "was proven." }));
  return wrap;
}

/* --- pulse ---
   The home page: what is moving, before anything is searched for. Two sources
   with two clocks. The registry (PULSE, from build_pulse.py) is monthly and
   covers every business in Kosovo; the audited filings (DATA) are yearly and
   cover the few hundred large companies that publish. Every block says which
   one it stands on, because the two are not the same population. */
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August",
                "September", "October", "November", "December"];
const monthName = (y, m) => MONTHS[m - 1] + " " + y;
const monthShort = (y, m) => MONTHS[m - 1].slice(0, 3) + " " + y;
function longDate(iso) {
  if (!iso) return "–";
  const [y, m, d] = iso.split("-").map(Number);
  return d + " " + MONTHS[m - 1].slice(0, 3) + " " + y;
}
const change = (now, was) => was ? (now / was - 1) * 100 : null;
const foldName = s => (s || "").toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "");
const PULSE_RANGES = [["1y", "1Y", 12], ["3y", "3Y", 36], ["10y", "10Y", 120],
                      ["all", "2001–", Infinity]];
/* A chain link needs enough companies on both ends to be about the sector of
   large filers rather than about a handful of them. */
const INDEX_MIN_PAIRS = 50, SECTOR_MIN_PAIRS = 10, SMALL_BASE = 50;

/* Revenue growth of the same companies, year on year, chained into an index.
   Summing whoever filed would be wrong: which companies file changes every
   year, and that sum reports a boom for the pandemic year 2020 in which the
   companies present in both years in fact shrank (the card shows the worst
   three such years, computed live). Computed
   here from the published figures, so it can never disagree with the screener.
   Unmatched filers are left out: some are a registered company filing under a
   second name, and would count that company twice. */
function revenueIndex() {
  const base = DATA.filter(r => !r.u);
  const rev = (r, y) => {
    const e = r.fy[String(y)];
    return e && e.rev != null && e.rev > 0 ? e.rev : null;
  };
  const steps = [];
  for (const y of YEARS.slice().sort((a, b) => a - b)) {
    let a = 0, b = 0, prevAll = 0, nowAll = 0;
    const pairs = [];
    for (const r of base) {
      const p = rev(r, y - 1), c = rev(r, y);
      if (p != null) prevAll += p;
      if (c != null) nowAll += c;
      if (p != null && c != null) { a += p; b += c; pairs.push([r, p, c]); }
    }
    if (pairs.length) steps.push({ y, n:pairs.length, g:(b / a - 1) * 100,
                                   naive: prevAll ? (nowAll / prevAll - 1) * 100 : null, pairs });
  }
  /* The newest year fills in slowly; a thin last link is dropped, not shown. */
  while (steps.length && steps[steps.length - 1].n < INDEX_MIN_PAIRS) steps.pop();
  let start = steps.length;
  while (start > 0 && steps[start - 1].n >= INDEX_MIN_PAIRS
         && (start === steps.length || steps[start].y === steps[start - 1].y + 1)) start--;
  const chain = steps.slice(start);
  if (!chain.length) return null;
  let level = 100;
  const points = [{ y:chain[0].y - 1, level:100, g:null }];
  for (const s of chain) {
    level *= 1 + s.g / 100;
    points.push({ y:s.y, level, g:s.g, n:s.n, naive:s.naive });
  }
  return { base:chain[0].y - 1, points, last:chain[chain.length - 1], chain };
}

/* The latest complete month, told as a story only when it is one. */
function pulseStory(P) {
  const st = P.story;
  const gap = st.since ? (st.y - st.since[0]) * 12 + (st.m - st.since[1]) : null;
  const yoy = change(st.now, st.was);
  const record = !st.since || gap >= 24;
  const wrap = el("section", { class:"pstory", "aria-labelledby":"pStory" });
  const text = el("div", { class:"ptext" });
  text.append(el("span", { class:"eyebrow", text:"What moved · " + monthName(st.y, st.m) }));
  text.append(el("h2", { id:"pStory", text: !st.since
      ? monthName(st.y, st.m) + " was the busiest month for new businesses since the series began in 2001."
      : gap >= 24
        ? monthName(st.y, st.m) + " was the busiest month for new businesses in "
          + Math.floor(gap / 12) + " years."
        : monthName(st.y, st.m) + ": " + fmt.format(st.now) + " new businesses, "
          + signed(yoy) + " on a year earlier." }));

  const ratio = st.was ? st.now / st.was : null;
  const body = [fmt.format(st.now) + " registrations, "
    + (ratio && ratio >= 1.5 ? ratio.toFixed(1) + " times " : signed(yoy) + " on ")
    + monthName(st.y - 1, st.m)
    + (record && st.since ? " and the most in any month since " + monthName(st.since[0], st.since[1])
                          : "") + ". "];
  const lower = a => a.translated ? a.label.charAt(0).toLowerCase() + a.label.slice(1) : a.label;
  const named = a => a.translated ? lower(a) : el("span", { lang:"sq", text:a.label });
  const form = st.forms.find(f => f.now > f.was);
  const acts = st.activities.filter(a => a.now > a.was);
  if (form) body.push(form.label + " rose from " + fmt.format(form.was) + " to "
                      + fmt.format(form.now) + (acts.length ? ", led by " : ". "));
  else if (acts.length) body.push("The largest increases: ");
  acts.forEach((a, i) => {
    body.push(named(a), " (" + fmt.format(a.now) + ", against " + fmt.format(a.was) + ")",
              i < acts.length - 1 ? " and " : ". ");
  });
  body.push("The registry records the change; it does not say why.");
  text.append(el("p", {}, body));
  wrap.append(text);

  const rows = [["All registrations", st.was, st.now, true]]
    .concat(form ? [[form.label, form.was, form.now]] : [])
    .concat(acts.map(a => [a.label, a.was, a.now]));
  const subTop = Math.max(1, ...rows.slice(1).map(r => Math.max(r[1], r[2])));
  const bars = el("div", { class:"pbars" },
    el("h3", { class:"cap", text:MONTHS[st.m - 1] + " " + st.y + " against " + (st.y - 1) }));
  for (const r of rows) {
    const top = r[3] ? Math.max(r[1], r[2]) : subTop;
    bars.append(el("div", { class:"sbar" },
      el("div", { class:"stop" }, el("span", { text:r[0] }),
         el("span", { text:fmt.format(r[1]) + " → " + fmt.format(r[2]) })),
      el("div", { class:"strack", "aria-hidden":"true" },
         el("span", { style:"width:" + (r[2] / top * 100).toFixed(1) + "%;background:#f5f5f5" }),
         el("span", { style:"width:" + (r[1] / top * 100).toFixed(1) + "%;background:#7a7a7a" }))));
  }
  bars.append(el("span", { class:"key",
    text:"Grey: " + MONTHS[st.m - 1] + " " + (st.y - 1) + ". White: " + MONTHS[st.m - 1] + " "
         + st.y + "." }));
  wrap.append(bars);
  return wrap;
}

/* Formation, monthly: registrations above the axis, closures below, on ONE
   scale — a second scale for closures would make 110 look like 2,078. Drawn as
   SVG stretched to the card's width; labels are HTML so they do not stretch. */
function formationChart(P) {
  const card = el("section", { class:"pcard", "aria-labelledby":"pForm" });
  const range = PULSE_RANGES.find(r => r[0] === state.pulseRange) || PULSE_RANGES[1];
  const ranges = el("div", { class:"ranges", role:"group", "aria-label":"Time range" });
  for (const r of PULSE_RANGES) {
    ranges.append(el("button", { type:"button", text:r[1], "data-fk":"range:" + r[0],
      "aria-pressed":String(range[0] === r[0]),
      "aria-label": r[0] === "all" ? "Since 2001" : "Last " + r[1].replace("Y", " years")
                                                    .replace("1 years", "12 months"),
      onClick: () => set({ pulseRange:r[0] }) }));
  }
  card.append(el("div", { class:"phead" },
    el("div", {}, el("h2", { id:"pForm", text:"Business formation, monthly" }),
       el("p", { class:"psub", text:"New registrations above the line, closures below, on one "
         + "scale. Every business in the ARBK registry, to the last complete month." })),
    ranges));

  const total = P.reg.length, n = Math.min(range[2], total), from = total - n;
  const reg = P.reg.slice(from), clo = P.clo.slice(from);
  const ym = i => {
    const k = P.start[1] - 1 + from + i;
    return [P.start[0] + Math.floor(k / 12), k % 12 + 1];
  };
  const maxR = Math.max(...reg), maxC = Math.max(...clo);
  const H = 180, scale = H / (maxR * 1.06), CH = Math.ceil(maxC * scale) + 3, W = n * 10;
  const svg = svgEl("svg", { viewBox:"0 0 " + W + " " + (H + CH), preserveAspectRatio:"none",
                             height:String(H + CH), "aria-hidden":"true", focusable:"false" });
  const step = maxR > 3000 ? 1000 : maxR > 1400 ? 500 : 250;
  const labels = [];
  for (let v = step; v < maxR * 1.06; v += step) {
    svg.append(svgEl("line", { x1:0, x2:W, y1:H - v * scale, y2:H - v * scale,
      stroke:"#d4d4d4", "stroke-dasharray":"3 3", "vector-effect":"non-scaling-stroke" }));
    labels.push(el("span", { class:"gridlbl", style:"top:" + (H - v * scale + 20).toFixed(1) + "px",
                             "aria-hidden":"true", text:fmt.format(v) }));
  }
  const [ly] = ym(n - 1);
  reg.forEach((v, i) => {
    const [y, m] = ym(i);
    const h = v * scale;
    const bar = svgEl("rect", { x:i * 10 + 1, width:8, y:H - h, height:h,
      fill: i === n - 1 ? INK : y === ly ? SECOND : "#8c8c8c" });
    const t = svgEl("title", {});
    t.textContent = monthShort(y, m) + ": " + fmt.format(v) + " new, " + fmt.format(clo[i]) + " closed";
    bar.append(t);
    svg.append(bar);
    svg.append(svgEl("rect", { x:i * 10 + 1, width:8, y:H + 1, height:clo[i] * scale,
                               fill:NEG, opacity:".85" }));
  });
  svg.append(svgEl("line", { x1:0, x2:W, y1:H, y2:H, stroke:INK,
                             "vector-effect":"non-scaling-stroke" }));

  const ticks = el("div", { class:"ticks", "aria-hidden":"true" });
  for (let i = 0; i < n; i++) {
    const [y, m] = ym(i);
    const show = n <= 12 ? true : m === 1 && (n <= 120 || y % 5 === 0);
    if (show) ticks.append(el("span", { style:"left:" + (i / n * 100).toFixed(2) + "%",
      text: n <= 12 ? MONTHS[m - 1].slice(0, 3) : String(y) }));
  }
  const [fy, fm] = ym(0), [lyy, lm] = ym(n - 1);
  const fig = el("figure", { class:"fchart", role:"img",
    "aria-label":"New business registrations and closures by month, " + monthName(fy, fm)
      + " to " + monthName(lyy, lm) + ". Registrations ranged from " + fmt.format(Math.min(...reg))
      + " to " + fmt.format(maxR) + " a month; closures from " + fmt.format(Math.min(...clo))
      + " to " + fmt.format(maxC) + "." },
    el("div", { class:"callout", "aria-hidden":"true",
      text:monthShort(lyy, lm) + " · " + fmt.format(reg[n - 1]) + " new · "
           + fmt.format(clo[n - 1]) + " closed" }),
    svg, labels, ticks);
  card.append(fig);

  const y = P.ytd, span = "Jan–" + MONTHS[P.last[1] - 1].slice(0, 3) + " " + P.last[0];
  card.append(el("div", { class:"plegend" },
    el("span", {}, el("i", { class:"sw", style:"background:" + SECOND, "aria-hidden":"true" }),
       "New registrations"),
    el("span", {}, el("i", { class:"sw", style:"background:" + NEG, "aria-hidden":"true" }),
       "Closures"),
    el("span", { class:"tot", text: span + ": " + fmt.format(y.now) + " new ("
      + signed(change(y.now, y.was)) + ") · " + fmt.format(y.cloNow) + " closed ("
      + signed(change(y.cloNow, y.cloWas)) + ")" })));
  return card;
}

/* Sectors as a heatmap: area is how many businesses are active in the sector
   today, shade is how fast new ones are arriving against last year. */
function sectorHeat(P) {
  const span = "Jan–" + MONTHS[P.last[1] - 1].slice(0, 3);
  const card = el("section", { class:"pcard", "aria-labelledby":"pHeat" });
  const key = el("div", { class:"heatkey", "aria-hidden":"true" }, el("span", { text:"−30%  " }));
  for (const c of [NEG, "#f2c4bf", "#e8e8e8", "#b9dcc6", POS]) {
    key.append(el("i", { style:"background:" + c }));
  }
  key.append(el("span", { text:"  +30%" }));
  card.append(el("div", { class:"phead" },
    el("div", {}, el("h2", { id:"pHeat", text:"Where new businesses are forming" }),
       el("p", { class:"psub", text:"Sectors of the economy. Tile size: businesses active today. "
         + "Shade: new registrations " + span + " " + P.last[0] + " against the same months of "
         + (P.last[0] - 1) + "." })),
    key));
  const shade = v => v >= 30 ? [POS, "#fff"] : v >= 10 ? ["#b9dcc6", INK]
    : v > -10 ? ["#e8e8e8", INK] : v > -30 ? ["#f2c4bf", INK] : [NEG, "#fff"];
  const top = Math.max(1, ...P.sectors.map(s => s.active));
  const list = el("ul", { class:"heat" });
  for (const s of P.sectors) {
    if (!s.was && !s.now) continue;
    const v = change(s.now, s.was);
    const [bg, fg] = v == null ? ["#e8e8e8", INK] : shade(v);
    const share = s.active / top;
    const screenable = DATA.some(r => r.s === s.sq);
    const kids = [
      el("span", { class:"tname", text:s.en }),
      el("span", { class:"sr", text:": new registrations " }),
      el("span", { class:"tfig" },
        el("b", { text: v == null ? "new" : signed(v) }),
        el("span", { text: s.was < SMALL_BASE ? "few" : fmt.format(s.now) + " new" })),
      el("span", { class:"sr", text: s.was < SMALL_BASE
        ? ", from a base of " + s.was + ", too few to read much into" : "" }),
    ];
    const style = "background:" + bg + ";color:" + fg;
    const tile = screenable
      ? el("a", { class:"tile", style, "data-fk":"heat:" + s.code,
          href: hrefFor({ route:"screener", sector:s.sq, selected:null }),
          title: "Screen the audited " + s.en.toLowerCase() + " companies",
          onClick: openOnClick(() => set({ route:"screener", sector:s.sq, selected:null,
                                           cursor:0, rowLimit:100 })) }, kids)
      : el("div", { class:"tile", style }, kids);
    list.append(el("li", { style:"grid-column:span " + (share >= .2 ? 2 : 1)
                                 + ";grid-row:span " + (share >= .6 ? 2 : 1) }, tile));
  }
  card.append(list);
  card.append(el("p", { class:"pfine", text:"“few” marks a base under " + SMALL_BASE
    + " registrations, where a percentage swings on a handful of businesses. A sector tile "
    + "opens the screener on that sector's audited companies." }));
  return card;
}

function indexCard(idx) {
  const card = pulseCard("Tregu Index · audited revenue",
    "The same companies compared year on year, chained. FY " + idx.base + " = 100, nominal euros.",
    "pIdx");
  const pts = idx.points, top = Math.max(...pts.map(p => p.level)) * 1.08;
  const bars = el("div", { class:"ibars" });
  const years = el("div", { class:"iyears", "aria-hidden":"true" });
  pts.forEach((p, i) => {
    const last = i === pts.length - 1;
    bars.append(el("div", { title: "FY " + p.y + ": " + p.level.toFixed(1)
                              + (p.g == null ? " (base)" : ", " + signed(p.g) + " on " + p.n
                              + " companies") },
      el("span", { class:"g", style:"color:" + (p.g == null ? MUTED : p.g < 0 ? NEG : POS),
                   text: p.g == null ? "" : (p.g > 0 ? "+" : "") + p.g.toFixed(0) + "%" }),
      el("span", { class:"b", style:"height:" + (p.level / top * 140).toFixed(1) + "px;background:"
                   + (last ? INK : p.g != null && p.g < 0 ? NEG : "#8c8c8c") })));
    years.append(el("span", { text:"’" + String(p.y).slice(2) }));
  });
  const L = pts[pts.length - 1];
  card.append(el("figure", { class:"fchart", role:"img",
    "aria-label":"Tregu Index of like-for-like audited revenue, FY " + idx.base + " equals 100. "
      + "It stood at " + L.level.toFixed(1) + " in FY " + L.y + ". Years it fell: "
      + (pts.filter(p => p.g != null && p.g < 0).map(p => p.y).join(", ") || "none") + "." },
    bars, years));
  card.append(el("div", { class:"ibig" },
    el("b", { text:L.level.toFixed(1) }),
    el("span", { class:"pdelta", style:"color:" + (L.g < 0 ? NEG : POS),
                 text:signed(L.g) + " in FY " + L.y }),
    el("span", { text:fmt.format(L.n) + " companies filed both years" })));

  /* The comparison that justifies the method, on the years where it matters most. */
  const worst = idx.chain.filter(s => s.naive != null)
    .sort((a, b) => Math.abs(b.naive - b.g) - Math.abs(a.naive - a.g)).slice(0, 3)
    .sort((a, b) => a.y - b.y);
  const table = el("table", { class:"flat" },
    el("caption", { class:"sr", text:"Revenue growth: summing every filer against comparing "
                                     + "the same companies" }),
    el("thead", {}, el("tr", {},
      el("th", { class:"l", scope:"col", text:"FY" }),
      el("th", { scope:"col", text:"Sum of filers" }),
      el("th", { scope:"col", text:"Same companies" }))));
  const tb = el("tbody");
  for (const s of worst) {
    tb.append(el("tr", {},
      el("th", { class:"l", scope:"row", style:"font-weight:400;font-family:var(--mono)",
                 text:String(s.y) }),
      el("td", { class:"strike" }, el("span", { class:"sr", text:"misleading: " }), signed(s.naive)),
      el("td", { style:"font-weight:600", text:signed(s.g) })));
  }
  table.append(tb);
  card.append(el("div", {}, el("h3", { class:"cap", style:"margin-bottom:6px",
    text:"Why not add up whoever filed?" }), table));
  card.append(el("p", { class:"pfine", text:"Which companies file changes every year, so a sum "
    + "of filers measures the filing, not the economy. It covers the large companies that "
    + "publish audited statements — not every business in Kosovo." }));
  return card;
}

function sectorRevenueCard(idx, P) {
  const last = idx.last;
  const card = pulseCard("Revenue by sector · FY " + last.y,
    "Like-for-like, from audited statements. Only sectors with " + SECTOR_MIN_PAIRS
    + " or more companies filing in both years.", "pSecRev");
  const en = Object.fromEntries((P ? P.sectors : []).map(s => [s.sq, s.en]));
  const by = {};
  for (const [r, p, c] of last.pairs) {
    if (!r.s) continue;
    const b = by[r.s] || (by[r.s] = { a:0, b:0, n:0 });
    b.a += p; b.b += c; b.n++;
  }
  const all = Object.entries(by);
  const shown = all.filter(([, b]) => b.n >= SECTOR_MIN_PAIRS)
    .map(([s, b]) => ({ s, name:en[s] || s, g:(b.b / b.a - 1) * 100, n:b.n, rev:b.b }))
    .sort((a, b) => b.rev - a.rev);
  const span = Math.max(1, ...shown.map(x => Math.abs(x.g)));
  for (const x of shown) {
    card.append(el("a", { class:"grow", href:hrefFor({ route:"screener", sector:x.s, selected:null }),
        "data-fk":"secrev:" + x.s, style:"color:inherit;text-decoration:none",
        onClick: openOnClick(() => set({ route:"screener", sector:x.s, selected:null,
                                         cursor:0, rowLimit:100 })) },
      el("span", { class:"gtop" }, el("span", { text:x.name }),
         el("span", { style:"color:" + (x.g < 0 ? NEG : POS), text:signed(x.g) })),
      el("span", { class:"gtrack", "aria-hidden":"true" },
         el("span", { style:"width:" + (Math.abs(x.g) / span * 100).toFixed(1) + "%;background:"
                            + (x.g < 0 ? NEG : POS) })),
      el("span", { class:"gnote", text:x.n + " companies · €" + compact(x.rev) + " revenue in FY "
                                       + last.y })));
  }
  const rest = all.length - shown.length;
  card.append(el("p", { class:"pfine", text: (shown.length ? "" : "No sector has enough filers "
      + "this year. ") + (rest ? fmt.format(rest) + " more sector" + (rest === 1 ? " has" : "s have")
      + " fewer than " + SECTOR_MIN_PAIRS + " filers each. A rate from three companies is a story "
      + "about three companies, so it is not shown here." : "") }));
  return card;
}

  card.append(feed);
  return card;
}

function renderPulse() {
  const wrap = el("div", { class:"pulse" });
  const P = PULSE;
  if (!P) {
    wrap.append(el("p", { class:"empty", text:"The registry figures were not part of this build. "
      + "Run build_pulse.py, then rebuild the page." }));
    return wrap;
  }
  const idx = revenueIndex();
  const st = P.story, y = P.ytd, span = "Jan–" + MONTHS[P.last[1] - 1].slice(0, 3);
  const gap = st.since ? (st.y - st.since[0]) * 12 + (st.m - st.since[1]) : null;
  const tile = (label, value, delta, color, note) => el("div", { class:"ptile" },
    el("span", { class:"cap", text:label }), el("b", { text:value }),
    el("span", { class:"pdelta", style:"color:" + color, text:delta }),
    el("span", { class:"pnote", text:note }));
  const yoyNew = change(y.now, y.was), yoyMonth = change(st.now, st.was);
  const tiles = el("section", { class:"pkpis", "aria-label":"Headline figures" },
    tile("New businesses · " + span, fmt.format(y.now), signed(yoyNew) + " on " + (P.last[0] - 1),
         yoyNew < 0 ? NEG : POS, fmt.format(y.was) + " in the same months of " + (P.last[0] - 1)),
    tile(monthName(st.y, st.m), fmt.format(st.now),
         signed(yoyMonth) + " on " + MONTHS[st.m - 1].slice(0, 3) + " " + (st.y - 1),
         yoyMonth < 0 ? NEG : POS,
         !st.since ? "Busiest month since 2001"
           : gap >= 12 ? "Busiest month since " + monthName(st.since[0], st.since[1])
           : "New registrations in the month"),
    tile("Closures · " + span, fmt.format(y.cloNow),
         signed(change(y.cloNow, y.cloWas)) + " on " + (P.last[0] - 1), SECOND,
         fmt.format(y.cloWas) + " in the same months of " + (P.last[0] - 1)),
    tile("Active businesses", fmt.format(P.status.active || 0),
         fmt.format(P.status.dormant || 0) + " dormant", SECOND,
         fmt.format(P.registry) + " ever registered"),
    idx ? tile("Tregu Index · FY " + idx.last.y, idx.points[idx.points.length - 1].level.toFixed(1),
               signed(idx.last.g) + " like-for-like", idx.last.g < 0 ? NEG : POS,
               fmt.format(idx.last.n) + " audited companies, FY " + idx.base + " = 100") : null);
  wrap.append(tiles);

  const main = el("div", { class:"pmain" },
    pulseStory(P), formationChart(P), sectorHeat(P),
    idx ? el("div", { class:"prow" }, indexCard(idx), sectorRevenueCard(idx, P)) : null,
    mixCard(P));
  const side = el("div", { class:"pside" }, placesCard(P), filingsCard(P));
  wrap.append(el("div", { class:"pcols" }, main, side));
  wrap.append(el("p", { class:"pfoot" },
    el("span", { text:"Registry: ARBK, every registered business, fetched "
      + longDate(P.snapshot) + "; the month in progress is left out until it ends." }),
    el("span", { text:"Financials: audited statements published by MFPT, shown only where the "
      + "statement's own arithmetic proves them." }),
    el("a", { href:"#/quality", "data-fk":"pfoot:quality",
              onClick: openOnClick(() => set({ route:"quality", selected:null })),
              text:"How the figures are proven" })));
  return wrap;
}

/* --- shell --- */
function pinRankColumn() {
  const rank = document.querySelector("#gridBody td.pin-rank")
            || document.querySelector(".colrow th.pin-rank");
  if (!rank) return;
  const table = rank.closest("table");
  if (table) table.style.setProperty("--pin",
    rank.getBoundingClientRect().width.toFixed(2) + "px");
}

let renderedRoute = null, renderedPageKey = null;
const BASE_TITLE = document.title;

/* What a screen reader should hear after this render — the thing that changed
   and did not move focus: a result count, a copied-rows confirmation, the name
   of the company stepped to. */
function describe(sc) {
  if (state.copyStatus) return state.copyStatus;
  if (state.route === "company") {
    const r = DATA.find(x => x.id === state.selected);
    return r ? r.n + ", FY " + r.y : "Company not found";
  }
  if (state.route === "screener" || state.route === "latest") {
    const warn = byId("warnLine").textContent;
    return byId("pageTitle").textContent + ": " + byId("resultLine").textContent
      + (warn ? ". " + warn : "")
      + (sc.rows.length ? "" : ". No company meets all of these criteria.");
  }
  return TITLES[state.route];
}

function render() {
  /* Coming back from a company, the row it was opened from is put back in view
     with the cursor on it — otherwise Back lands at the top of a list of 800 and
     the reader has lost their place. */
  const returning = renderedRoute === "company"
    && (state.route === "screener" || state.route === "latest");
  const firstRender = renderedPageKey === null;
  const pageChanged = !firstRender && renderedPageKey !== pageKey();
  const focusKey = focusKeyOf(document.activeElement);
  renderedRoute = state.route;
  renderedPageKey = pageKey();
  const rows = pool();
  const sc = screened(rows);
  lastRows = sc.rows;
  const cols = VIEWS[state.view];
  const shown = sc.rows.slice(0, state.rowLimit);
  if (state.cursor > shown.length - 1) state.cursor = Math.max(0, shown.length - 1);

  renderChrome(rows);
  renderPagebar(rows, sc, shown, cols);
  /* The rail's filters act on the company list; on the Pulse they would only
     look as if they changed it. */
  document.querySelector(".split").dataset.route = state.route;
  const next = state.route === "pulse" ? renderPulse()
             : state.route === "company" ? renderCompany()
             : state.route === "sectors" ? renderSectors(rows)
             : state.route === "movers" ? renderMovers(rows)
             : state.route === "quality" ? renderQuality(rows)
             : renderScreener(sc, shown, cols, rows);
  byId("scroll").replaceChildren(next);
  pinRankColumn();
  /* The rank column is laid out before the mono face arrives and widens when it
     does, so the offset is taken again once the fonts have settled. */
  if (document.fonts) document.fonts.ready.then(pinRankColumn);
  if (returning) moveCursor(0);
  renderFooter(sc);

  /* The tab and history entry name the view, so a bookmark, a browser history
     list or a screen reader's window title says which company or year this is. */
  const co = state.route === "company" ? DATA.find(x => x.id === state.selected) : null;
  document.title = state.route === "company" ? (co ? co.n : "Company") + " · Tregu"
                 : state.route === "latest" ? "FY " + state.year + " · Tregu"
                 : state.route === "pulse" ? BASE_TITLE
                 : TITLES[state.route] + " · Tregu";

  if (firstRender) return;   // nothing has changed yet; leave focus where the browser put it
  const landed = placeFocus(focusKey, pageChanged, returning);
  /* Arriving on a company's heading, the reader hears its name from the heading
     itself; announcing it too would say it twice. */
  if (!(landed && landed.id === "coHeading")) announce(describe(sc));
}

/* Search finds companies, so typing on the Pulse opens the screener with the
   results; the other views are already lists the search narrows. From the
   Pulse it searches everything: a sector or criteria left from an earlier
   visit to the list are invisible here, and silently narrowing by them found
   4 companies for "viva" where there are more. */
byId("q").addEventListener("input",
  e => set(Object.assign({ q:e.target.value, cursor:0, rowLimit:100 },
    state.route === "pulse"
      ? { route:"screener", selected:null, sector:"", active:[], preset:null } : {})));
byId("sector").addEventListener("change",
  e => set({ sector:e.target.value, cursor:0, rowLimit:100 }));
byId("unmatched").addEventListener("change",
  e => set({ includeUnmatched:e.target.checked, cursor:0 }));
byId("critMetric").addEventListener("change", e => set({ critMetric:e.target.value }));
byId("critOp").addEventListener("change", e => set({ critOp:e.target.value }));
byId("critValue").addEventListener("input", e => { state.critValue = e.target.value; });
byId("critValue").addEventListener("keydown", e => { if (e.key === "Enter") addCriterion(); });
byId("critAdd").addEventListener("click", addCriterion);
window.addEventListener("keydown", onKey);
window.addEventListener("resize", pinRankColumn);
byId("skip").addEventListener("click", () => {
  const target = document.querySelector("#gridBody tr.cur a.rowlink")
              || document.querySelector("#gridBody a.rowlink, table.sectors a.rowlink, .moveritem, "
                                        + ".pulse a, .pulse button")
              || byId("coHeading") || byId("pageTitle");
  if (target) target.focus();
});
/* Back, Forward, and a hash edited by hand all land here. popstate and
   hashchange can both fire for one navigation; applyUrl ignores a hash it has
   already applied, so the page renders once. */
window.addEventListener("popstate", applyUrl);
window.addEventListener("hashchange", applyUrl);
if (location.hash && location.hash !== "#" && location.hash !== "#/") {
  applyUrl();
} else {
  lastAppliedHash = location.hash || "#/";
  render();
}
</script>
