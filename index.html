<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tregu — Kosovo's economy and company fundamentals</title>
<meta name="description" content="Fundamentals for 893 Kosovo companies, read from audited financial statements published by the Ministry of Finance and joined to the ARBK business registry. Every figure shown was proven against the statement’s own arithmetic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  /* The design commits to one visual world - a lit sheet between a dark header
     and a dark status bar - so every colour is stated outright rather than
     themed. Nothing is left to the host theme, including the body ground. */
  :root {
    --ground:#f0f0f0; --surface:#ffffff; --rail:#ebebeb;
    /* muted and faint are darker than the design file states: at #767676 and
       #b0b0b0 they measured 3.8:1 on the grey grounds and 2.2:1 on white, against
       WCAG AA's 4.5:1 — 248 failures on the screener alone. These pass on every
       ground they sit on (white, rail, header, cursor row). Faint keeps its
       quieter role through glyph weight instead: a blank is an en dash, not an
       em dash. */
    --ink:#0a0a0a; --second:#4a4a4a; --muted:#666666; --faint:#6b6b6b;
    --rule:#e2e2e2; --rule-soft:#ededed; --rule-mid:#c8c8c8; --rule-rail:#d4d4d4;
    --hover:#e2e2e2; --tint:#e8e8e8; --cursor:#efefef; --sub:#f7f7f7;
    --pos:#0f7a43; --neg:#c22a1d; --series:#555555; --bar:#8c8c8c;
    --dark:#0a0a0a; --dark-rule:#333333; --dark-field:#1f1f1f;
    --dark-ink:#f5f5f5; --dark-mid:#a0a0a0; --dark-dim:#7a7a7a;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --serif:Newsreader, Georgia, "Times New Roman", serif;
    --rail-w:246px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:var(--ground); color:var(--ink); font-size:13px; line-height:1.45;
    font-family:Archivo, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a { color:var(--ink); text-decoration:none; }
  a:hover { color:#000; text-decoration:underline; }
  ::selection { background:var(--tint); }
  input, select, button { font-family:inherit; }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline:2px solid var(--ink); outline-offset:1px;
  }
  ::-webkit-scrollbar { width:11px; height:11px; }
  ::-webkit-scrollbar-thumb { background:var(--rule-mid); border:3px solid var(--ground);
                              border-radius:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* ---------- accessibility ---------- */
  /* Present to a screen reader, absent to the eye. */
  .sr { position:absolute !important; width:1px; height:1px; padding:0; margin:-1px;
        overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0; }
  /* The first Tab stop on the page: past the search, the five views, the filters
     and the criteria, straight to the companies. Hidden until it has focus. */
  .skip { position:fixed; left:12px; top:-48px; z-index:100; background:var(--ink); color:#fff;
          border:0; border-radius:3px; padding:9px 14px; font-size:13px; font-weight:500;
          cursor:pointer; }
  .skip:focus { top:10px; }
  /* Headings receive focus when the view changes so a screen reader announces
     the new page; they are not controls, so they get no ring. */
  h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline:none; }
  h2.cap, h3.cap { margin:0; }
  /* A blank figure: an en dash for the eye, "not proven" for the ear. */
  .nil { color:var(--faint); }
  .cap { font-size:9px; letter-spacing:.2em; text-transform:uppercase;
         color:var(--muted); font-weight:600; }

  /* ---------- shell ---------- */
  .shell { display:grid; grid-template-rows:52px minmax(0,1fr) 28px; height:100vh; }

  /* ---------- header ---------- */
  header { display:grid; grid-template-columns:var(--rail-w) minmax(0,1fr) auto;
           align-items:center; background:var(--dark); border-bottom:1px solid #000;
           padding-right:16px; }
  .brand { padding:0 18px; border-right:1px solid var(--dark-rule); }
  .brand .word { font-family:var(--serif); font-size:17px; font-weight:500;
                 color:var(--dark-ink); letter-spacing:-.005em; line-height:1.1; }
  .brand .sub { font-family:var(--mono); font-size:8.5px; letter-spacing:.22em;
                text-transform:uppercase; color:var(--dark-mid); margin-top:2px; }
  .find { display:flex; align-items:center; gap:10px; padding:0 16px; min-width:0; }
  .find input { flex:0 1 420px; min-width:0; font-size:13px; color:var(--dark-ink);
                background:var(--dark-field); border:1px solid var(--dark-rule);
                border-radius:3px; padding:6px 10px; }
  .find input::placeholder { color:#8c8c8c; }   /* 4.9:1 on the dark field; dark-dim was 3.8 */
  .find kbd { font-family:var(--mono); font-size:10px; color:var(--dark-dim);
              border:1px solid var(--dark-rule); border-radius:3px; padding:2px 5px; }
  .topstats { display:flex; gap:22px; align-items:baseline; }
  .topstats > div { text-align:right; }
  .topstats b { display:block; font-family:var(--mono); font-size:13px; font-weight:400;
                color:var(--dark-ink); font-variant-numeric:tabular-nums; }
  .topstats span { display:block; font-size:8.5px; letter-spacing:.16em;
                   text-transform:uppercase; color:var(--dark-dim); margin-top:1px; }

  /* ---------- body split ---------- */
  .split { display:grid; grid-template-columns:var(--rail-w) minmax(0,1fr); min-height:0; }
  aside { background:var(--rail); border-right:1px solid var(--rule-rail);
          overflow-y:auto; min-height:0; }
  aside section { padding:14px 16px; border-bottom:1px solid var(--rule-rail); }
  aside section:last-child { border-bottom:0; }
  aside select, aside input[type="number"] {
    width:100%; font-size:12.5px; color:var(--ink); background:#fff;
    border:1px solid var(--rule-mid); border-radius:3px; padding:6px 7px;
  }
  aside select { margin-top:9px; }

  nav { display:flex; flex-direction:column; padding:8px 0;
        border-bottom:1px solid var(--rule-rail); }
  .navbtn { display:grid; grid-template-columns:2px 1fr auto; align-items:center; gap:12px;
            border:0; background:transparent; color:var(--second); cursor:pointer;
            padding:7px 16px 7px 0; text-align:left; font-size:13px; width:100%; }
  .navbtn:hover { background:var(--hover); }
  .navbtn[aria-current="page"] { background:#fff; color:var(--ink); font-weight:600; }
  .navmark { display:block; height:16px; background:transparent; }
  .navbtn[aria-current="page"] .navmark { background:var(--ink); }
  .navbadge { font-family:var(--mono); font-size:10.5px; color:var(--muted);
              font-variant-numeric:tabular-nums; }

  .chk { display:flex; align-items:center; gap:8px; margin-top:9px; font-size:12.5px;
         color:var(--second); cursor:pointer; }
  .chk input { width:13px; height:13px; accent-color:var(--ink); cursor:pointer; }

  .presets { display:flex; flex-direction:column; gap:1px; margin-top:8px; }
  .preset { border:0; border-left:2px solid transparent; background:transparent;
            cursor:pointer; text-align:left; padding:6px 8px; width:100%; }
  .preset:hover { background:var(--hover); }
  .preset[aria-pressed="true"] { background:#fff; border-left-color:var(--ink); }
  .preset b { display:block; font-size:12.5px; font-weight:400; color:var(--ink); }
  .preset[aria-pressed="true"] b { font-weight:600; }
  .preset span { display:block; font-size:11px; color:var(--muted); margin-top:1px;
                 line-height:1.35; }

  .critgrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
  .critgrid input[type="number"] { font-family:var(--mono); min-width:0; }
  .addcrit { width:100%; margin-top:6px; border:1px solid var(--ink); background:var(--ink);
             color:#fff; border-radius:3px; padding:6px; font-size:12.5px; font-weight:500;
             cursor:pointer; }
  .addcrit:hover { background:#000; }
  .chips { display:flex; flex-direction:column; gap:4px; margin-top:9px; }
  .chip { display:flex; align-items:center; justify-content:space-between; gap:8px;
          padding:4px 4px 4px 8px; background:var(--tint); border-left:2px solid var(--ink); }
  .chip span { font-family:var(--mono); font-size:11.5px; font-weight:500; color:#000; }
  .chip button { border:0; background:transparent; color:var(--ink); cursor:pointer;
                 line-height:1; padding:0 3px; font-size:14px; }
  .note { margin:12px 0 0; font-size:11px; line-height:1.5; color:var(--muted); }

  /* ---------- main ---------- */
  main { display:grid; grid-template-rows:auto minmax(0,1fr); min-height:0;
         background:var(--surface); }
  .pagebar { display:flex; flex-wrap:wrap; gap:14px; align-items:baseline;
             padding:12px 18px 11px; border-bottom:1px solid var(--rule-mid); }
  .pagebar h1 { margin:0; font-family:var(--serif); font-size:21px; font-weight:500;
                letter-spacing:-.01em; }
  .pagebar .count { font-family:var(--mono); font-size:11.5px; color:var(--muted);
                    font-variant-numeric:tabular-nums; }
  .pagebar .warn { font-size:11.5px; color:var(--neg); }
  .pagebar .right { display:flex; gap:8px; align-items:center; margin-left:auto; }
  .tabs { display:flex; border:1px solid var(--rule-mid); border-radius:3px; overflow:hidden; }
  .tabs button { border:0; border-left:1px solid var(--rule); cursor:pointer; padding:5px 12px;
                 font-size:12px; background:#fff; color:var(--second); }
  .tabs button:first-child { border-left:0; }
  .tabs button[aria-pressed="true"] { background:var(--tint); color:#000; font-weight:600; }
  .btn { border:1px solid var(--rule-mid); background:#fff; color:var(--ink);
         border-radius:3px; padding:5px 11px; font-size:12px; cursor:pointer; }
  .btn:hover { background:var(--ground); }
  .yearsel { border:1px solid var(--rule-mid); background:#fff; color:var(--ink);
             border-radius:3px; padding:5px 8px; font-family:var(--mono);
             font-size:12px; font-weight:500; cursor:pointer; }
  /* position:relative makes the sheet the containing block for the
     screen-reader-only spans inside its tables. Left static, those absolutely
     positioned spans were placed against <body>, escaped the sheet's clipping,
     and widened the page to the table's full 1,193px — so a phone zoomed the
     whole site out to fit. Measured 2026-11-13; 121 spans on the screener. */
  #scroll { overflow:auto; min-height:0; position:relative; }
  .lede { margin:0; padding:16px 18px; max-width:84ch; font-size:12.5px; color:var(--second);
          line-height:1.6; border-bottom:1px solid var(--rule); }
  .foot { margin:0; padding:18px 18px 28px; max-width:84ch; font-size:11.5px;
          line-height:1.6; color:var(--muted); }
  .empty { padding:28px 18px; font-size:13px; color:var(--second); max-width:70ch; }

  /* ---------- screener table ---------- */
  table.grid { border-collapse:separate; border-spacing:0; width:100%; min-width:1080px; }
  table.grid th { background:var(--ground); white-space:nowrap; }
  .grouprow th { position:sticky; top:0; z-index:3; border-bottom:1px solid var(--rule);
                 border-left:1px solid var(--rule); padding:6px 12px; text-align:left;
                 font-size:8.5px; letter-spacing:.2em; text-transform:uppercase;
                 color:var(--muted); font-weight:600; height:26px; }
  .colrow th { position:sticky; top:26px; z-index:3; border-bottom:1px solid var(--rule-mid);
               border-left:1px solid var(--rule); padding:0; }
  .colrow th button { border:0; background:transparent; cursor:pointer; display:block;
                      width:100%; padding:6px 12px 7px; font-size:10px; letter-spacing:.07em;
                      text-transform:uppercase; font-weight:600; color:var(--muted); }
  .colrow th[aria-sort] button { color:var(--ink); }
  .colrow th[aria-sort="descending"] button::after { content:" \2193"; }
  .colrow th[aria-sort="ascending"] button::after { content:" \2191"; }
  th.pin, td.pin { border-left:0; }
  th.pin-rank, td.pin-rank { position:sticky; left:0; width:44px; min-width:44px;
                             max-width:44px; }
  /* A colspan cell can widen the column it starts in, so the rank column is not
     always the 44px it asks for. The name column is pinned to what rank actually
     measured, or it overlaps by the difference. */
  th.pin-group { position:sticky; left:0; }
  th.pin-name, td.pin-name { position:sticky; left:var(--pin, 44px); }
  .grouprow th.pin, .colrow th.pin { z-index:4; }
  .colrow th.pin-rank button { padding:6px 8px 7px 4px; text-align:right; }
  .colrow th.l button { text-align:left; }
  .colrow th.r button { text-align:right; }
  table.grid tbody tr { cursor:pointer; }
  /* The company cell is a <th scope="row">, so a screen reader names the company
     as it reads each figure across the row. Styled exactly as a body cell. */
  table.grid tbody td, table.grid tbody th {
                        background:var(--surface); border-bottom:1px solid var(--rule-soft);
                        border-left:1px solid var(--rule); padding:7px 12px;
                        vertical-align:middle; text-align:right; font-family:var(--mono);
                        font-size:12.5px; font-weight:400; font-variant-numeric:tabular-nums;
                        white-space:nowrap; max-width:190px; overflow:hidden;
                        text-overflow:ellipsis; }
  table.grid tbody tr.cur > td, table.grid tbody tr.cur > th { background:var(--cursor); }
  /* Body-cell rules are written against `table.grid tbody`, never as a bare
     `td.x`. A bare rule has specificity (0,1,1) and loses every property it
     shares with `table.grid tbody td` (0,1,3) — which is how, from v2's first
     build until 2026-11-13, company names rendered right-aligned in the figure
     font, the sector and city columns likewise, and rank at 12.5px. */
  table.grid tbody .pin { border-left:0; }
  table.grid tbody td.pin-rank { z-index:1; padding:7px 8px 7px 4px; font-size:11px;
                                 color:var(--faint); max-width:44px; }
  table.grid tbody .pin-name { z-index:1; border-right:1px solid var(--rule);
                padding:6px 14px 6px 4px; vertical-align:baseline; max-width:258px;
                text-align:left; font-family:inherit; }
  /* The company name is a real link to its page: Tab reaches it, Enter opens it,
     and middle-click or Ctrl-click opens it in a new tab like any other link. */
  a.rowlink { display:block; color:inherit; text-decoration:none; }
  a.rowlink:hover { text-decoration:none; }
  a.rowlink:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  /* One line each for the name and its subtitle: a dense table loses its shape
     the moment a three-line company name sets the row height for everything. */
  .coname, .cosub { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .coname { font-size:12.5px; font-weight:500; color:var(--ink); }
  .cosub { font-size:10.5px; color:var(--muted); margin-top:1px; }
  .cosub.unreg { font-style:italic; }
  table.grid tbody td.txt { text-align:left; font-family:inherit; }
  .databar { display:block; height:3px; background:var(--rule); margin-top:3px; }
  .databar > span { display:block; height:3px; background:var(--bar); }
  .spark { display:block; width:60px; height:16px; overflow:visible; }
  .more { border:0; border-top:1px solid var(--rule); background:var(--sub); color:var(--ink);
          cursor:pointer; width:100%; padding:10px; font-family:var(--mono); font-size:12px;
          font-weight:500; }
  .more:hover { background:var(--tint); }

  /* ---------- company ---------- */
  .cohead { display:flex; flex-wrap:wrap; align-items:baseline; gap:14px;
            padding:18px 18px 16px; border-bottom:1px solid var(--rule); }
  .cohead h2 { margin:0; font-family:var(--serif); font-size:30px; font-weight:400;
               letter-spacing:-.015em; line-height:1.12; text-wrap:balance; }
  .cometa { margin-top:6px; font-size:12px; color:var(--muted); }
  .twinnote { margin-top:8px; max-width:78ch; font-size:11.5px; line-height:1.55;
              color:var(--ink); border-left:2px solid var(--neg); padding-left:9px; }
  .coacts { display:flex; gap:6px; align-items:center; margin-left:auto; }
  .yrbadge { font-family:var(--mono); font-size:11.5px; font-weight:600; color:#000;
             background:var(--tint); padding:3px 8px; }
  .kpis { display:flex; flex-wrap:wrap; border-bottom:1px solid var(--rule); }
  .kpis > div { flex:1 1 150px; padding:12px 18px; border-left:1px solid var(--rule); }
  .kpis b { display:block; margin-top:4px; font-family:var(--mono); font-size:20px;
            font-weight:450; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .kpis .cap { font-size:9px; letter-spacing:.18em; }
  .panelrow { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
  .panelrow.wide { grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); }
  .panel { padding:16px 18px 20px; border-left:1px solid var(--rule);
           border-bottom:1px solid var(--rule); }
  .panel .cap { font-size:9px; letter-spacing:.18em; }
  .chart { padding:16px 18px 18px; border-left:1px solid var(--rule);
           border-bottom:1px solid var(--rule); }
  .charthead { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .charthead .cap { font-size:9px; letter-spacing:.18em; }
  .charthead .last { font-family:var(--mono); font-size:12px; color:var(--ink);
                     font-variant-numeric:tabular-nums; }
  .chart svg { display:block; width:100%; height:auto; margin-top:10px; overflow:visible; }
  .chartyrs { display:flex; justify-content:space-between; margin-top:6px;
              font-family:var(--mono); font-size:10px; color:var(--muted);
              font-variant-numeric:tabular-nums; }
  table.flat { border-collapse:collapse; width:100%; margin-top:10px; }
  table.flat th { text-align:right; padding:0 0 6px 14px; font-size:9.5px; letter-spacing:.12em;
                  text-transform:uppercase; color:var(--muted); font-weight:600;
                  white-space:nowrap; }
  table.flat th.l { text-align:left; padding-left:0; }
  table.flat tbody tr { border-top:1px solid var(--rule-soft); }
  table.flat td { padding:5px 0 5px 14px; text-align:right; font-family:var(--mono);
                  font-size:12.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.flat td.l { text-align:left; padding-left:0; font-family:inherit; color:var(--ink); }
  .srclinks { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .srclink { display:inline-block; padding:4px 11px; border:1px solid var(--rule-mid);
             background:#fff; color:var(--ink); font-family:var(--mono); font-size:12px;
             font-weight:500; }
  .srclink:hover { background:var(--tint); text-decoration:none; }
  /* A figure that opens its source page. Dotted, so the table still reads as
     figures first; solid on hover, so it is unmistakably a link when reached. */
  a.fig { text-decoration:none; border-bottom:1px dotted var(--rule-mid); }
  a.fig:hover, a.fig:focus-visible { text-decoration:none; border-bottom:1px solid currentColor; }
  a.figbar { cursor:pointer; }
  a.figbar:hover rect, a.figbar:focus-visible rect { opacity:.72; }

  /* ---------- sectors ---------- */
  table.sectors { border-collapse:separate; border-spacing:0; width:100%; min-width:1080px; }
  /* Header styles are scoped to thead: the sector name in each body row is a
     <th scope="row"> too, and must not inherit the sticky uppercase header. */
  table.sectors thead th { position:sticky; top:0; z-index:3; background:var(--ground);
                     border-bottom:1px solid var(--rule-mid); padding:7px 14px;
                     text-align:right; font-size:10px; letter-spacing:.07em;
                     text-transform:uppercase; color:var(--muted); font-weight:600;
                     white-space:nowrap; }
  table.sectors thead th.first { left:0; z-index:4; text-align:left;
                           border-right:1px solid var(--rule); }
  table.sectors tbody tr { cursor:pointer; }
  table.sectors tbody td, table.sectors tbody th {
                     background:var(--surface); border-bottom:1px solid var(--rule-soft);
                     padding:9px 14px; text-align:right; font-family:var(--mono);
                     font-size:12.5px; font-weight:400; font-variant-numeric:tabular-nums;
                     white-space:nowrap; }
  table.sectors tbody .first { position:sticky; left:0; z-index:1; text-align:left;
                           font-family:inherit; font-weight:500; color:var(--ink);
                           border-right:1px solid var(--rule); min-width:300px;
                           max-width:340px; overflow:hidden; text-overflow:ellipsis; }
  table.sectors tbody tr:hover td, table.sectors tbody tr:hover th { background:var(--sub); }
  table.sectors a.rowlink { overflow:hidden; text-overflow:ellipsis; }

  /* ---------- movers ---------- */
  .moverlists { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
  .moverlist { border-left:1px solid var(--rule); border-bottom:1px solid var(--rule); }
  .moverhead { padding:12px 16px 10px; border-bottom:1px solid var(--rule); }
  .moverhead .cap { font-size:9px; letter-spacing:.18em; }
  .moverhead div { font-size:11.5px; color:var(--muted); margin-top:3px; }
  .moveritem { display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:10px;
               align-items:baseline; padding:7px 16px; border:0;
               border-bottom:1px solid var(--rule-soft); cursor:pointer; width:100%;
               background:transparent; text-align:left; font:inherit; }
  .moveritem:hover { background:var(--sub); text-decoration:none; }
  .moveritem .rank { font-family:var(--mono); font-size:10.5px; color:var(--faint);
                     font-variant-numeric:tabular-nums; }
  .moveritem .nm { font-size:12.5px; color:var(--ink); overflow:hidden;
                   text-overflow:ellipsis; white-space:nowrap; }
  .moveritem .val { font-family:var(--mono); font-size:12.5px;
                    font-variant-numeric:tabular-nums; }

  /* ---------- quality ---------- */

  if (a >= 1e9) return sign + (a / 1e9).toFixed(1) + "bn";
  if (a >= 1e6) return sign + (a / 1e6).toFixed(1) + "m";
  if (a >= 1e3) return sign + Math.round(a / 1e3) + "k";
  return String(Math.round(v));
};

const TITLES = { pulse:"Pulse", screener:"Screener", company:"Company",
                 sectors:"Sector league table", movers:"Movers", quality:"Data quality",
                 latest:"By fiscal year" };

const state = {
  route:"pulse", pulseRange:"3y", view:OPTS.defaultView, q:"", sector:"",
  includeUnmatched:OPTS.includeUnmatchedByDefault,
  sortKey:DEFAULT_SORT[OPTS.defaultView], sortAsc:false,
  critMetric:"nm", critOp:"ge", critValue:"", active:[], preset:null,
  selected:null, cursor:0, copyStatus:"", rowLimit:100,
  year: YEARS[0],
};
const set = (patch, opts) => {
  /* A company opens over whichever list it was opened from, and closing goes
     back there — landing on the screener after opening a row from FY 2025
     loses the year the reader was working in. */
  if (patch.route === "company" && state.route !== "company") state.backRoute = state.route;
  const before = pageKey();
  Object.assign(state, { copyStatus:"" }, patch);
  render();
  syncUrl(before, opts && opts.history);
};

/* Rows as last laid out, so the keyboard walks exactly what the eye sees. */
let lastRows = [];

/* --- the address bar ---
   Every view a reader can reach is a URL they can send. A reference that cannot
   be cited is a demo: "the FY 2024 companies with net margin over 10%" should be
   a link, not a description of the clicks that produce it.

   Hash-based, so the static host needs no routing rules:
     #/                                    the Pulse — the home page
     #/screener                            the screener, default columns
     #/screener?view=ratios&c=nm:ge:10     criteria as metric:op:value
     #/screener?preset=compounders         a saved screen, unmodified
     #/year/2024?sort=np                   every company on one fiscal year
     #/company/811271014                   one company
     #/sectors   #/movers   #/quality

   Opening a page pushes a history entry; changing a filter replaces the current
   one. So Back steps between pages rather than undoing keystrokes, and Back from
   a company lands on the list exactly as it was left.

   Until 2026-11-14 the bare `#/` was the screener; it is now the Pulse. Every
   screener link ever generated carries `#/screener` (a filtered one always has
   a query, so it was never collapsed to the bare root), so only links to the
   home page itself changed what they show — which is what a home link means. */
const PATHS = { pulse:"pulse", screener:"screener", latest:"year", sectors:"sectors",
                movers:"movers", quality:"quality", company:"company" };
const ROUTES = Object.fromEntries(Object.entries(PATHS).map(([r, p]) => [p, r]));
const SORTABLE = new Set(["n"].concat(...Object.values(VIEWS).map(v => v.map(c => c.k))));
let applyingUrl = false;      // true while state is being set FROM the URL
let companyPushed = false;    // this company page was entered by a push of ours
let lastAppliedHash = null;

/* Readable in the address bar: colons and commas are legal in a fragment, and
   `c=nm:ge:5,cagr:ge:10` reads; `c=nm%3Age%3A5%2Ccagr…` does not. */
const enc = v => encodeURIComponent(String(v)).replace(/%3A/gi, ":").replace(/%2C/gi, ",");

function pageKey() {
  return state.route === "company" ? "company:" + state.selected : state.route;
}

function critEquals(a, b) {
  return a.length === b.length
    && a.every((c, i) => c.k === b[i].k && c.op === b[i].op && c.v === b[i].v);
}

function stateToUrl() {
  if (state.route === "pulse") return "#/";
  if (state.route === "company") return "#/company/" + enc(state.selected || "");
  const path = "#/" + PATHS[state.route] + (state.route === "latest" ? "/" + state.year : "");
  const params = [];
  const add = (k, v) => params.push(k + "=" + enc(v));
  if (state.route === "screener" || state.route === "latest") {
    const preset = PRESETS.find(p => p.id === state.preset);
    /* An untouched saved screen is one short word; a modified one is spelled
       out, so the link still means what the sender saw. */
    if (preset && state.view === preset.view && !state.sortAsc
        && state.sortKey === DEFAULT_SORT[preset.view] && critEquals(state.active, preset.crit)) {
      add("preset", preset.id);
    } else {
      if (state.view !== OPTS.defaultView) add("view", state.view);
      if (state.sortKey !== DEFAULT_SORT[state.view]) add("sort", state.sortKey);
      if (state.sortAsc) add("asc", "1");
      if (state.active.length) {
        add("c", state.active.map(c => c.k + ":" + c.op + ":" + c.v).join(","));
      }
    }
  }
  if (state.q) add("q", state.q);
  if (state.sector) add("sector", state.sector);
  if (state.includeUnmatched) add("unmatched", "1");
  return path + (params.length ? "?" + params.join("&") : "");
}

/* Everything in a URL is checked before it touches state: a hand-edited or
   truncated link should degrade to the nearest valid view, never to a broken
   page. Unknown keys, operators, sectors and years are dropped, not trusted. */
function urlToPatch(hash) {
  const raw = (hash || "").replace(/^#\/?/, "");
  const cut = raw.indexOf("?");
  const pathPart = cut < 0 ? raw : raw.slice(0, cut);
  const params = new URLSearchParams(cut < 0 ? "" : raw.slice(cut + 1));
  const segs = pathPart.split("/").filter(Boolean).map(s => {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  });
  /* No path is the home page. An unknown one still degrades to the screener,
     as it always has: a mistyped list link should land on a list. */
  const route = segs.length ? ROUTES[segs[0]] || "screener" : "pulse";
  if (route === "pulse") return { route, selected:null };

  /* A company link carries no list context: the page stands on its own, and
     arriving from a list keeps that list's filters for stepping with [ and ]. */
  if (route === "company") return { route, selected: segs[1] || null };

  const patch = {
    route, selected:null, view:OPTS.defaultView, sortAsc:false, active:[], preset:null,
    q: params.get("q") || "", sector: params.get("sector") || "",
    includeUnmatched: params.get("unmatched") === "1",
  };
  if (route === "latest") {
    const y = Number(segs[1]);
    patch.year = YEARS.includes(y) ? y : YEARS[0];
  }
  const preset = PRESETS.find(p => p.id === params.get("preset"));
  if (preset) Object.assign(patch, { preset:preset.id, active:preset.crit.slice(),
                                     view:preset.view });
  if (VIEWS[params.get("view")]) patch.view = params.get("view");
  const sort = params.get("sort");
  patch.sortKey = sort && SORTABLE.has(sort) ? sort : DEFAULT_SORT[patch.view];
  patch.sortAsc = params.get("asc") === "1";
  if (params.get("c")) {
    patch.active = params.get("c").split(",").map(part => {
      const [k, op, v] = part.split(":");
      const num = Number(v);
      return CRITERIA.some(x => x.k === k) && (op === "ge" || op === "le")
        && v !== undefined && v !== "" && Number.isFinite(num) ? { k, op, v:num } : null;
    }).filter(Boolean);
    if (preset && !critEquals(patch.active, preset.crit)) patch.preset = null;
  }
  if (patch.sector && !DATA.some(r => r.s === patch.sector)) patch.sector = "";
  return patch;
}

function applyUrl() {
  const hash = location.hash || "#/";
  if (hash === lastAppliedHash) return;
  lastAppliedHash = hash;
  const patch = urlToPatch(hash);
  if (patch.route === "company" && state.route !== "company") state.backRoute = state.route;
  companyPushed = false;
  applyingUrl = true;
  try {
    Object.assign(state, { copyStatus:"" }, patch);
    render();
  } finally {
    applyingUrl = false;
  }
  /* A link that asked for something invalid — FY 1999, an unknown sort, a
     criterion on a metric that does not exist — has been repaired into the
     nearest valid view. The address bar must then say what is on screen, not
     what was asked for, or the next person it is copied to gets a URL that
     disagrees with the page they saw. */
  const canonical = stateToUrl();
  if (canonical !== hash && !(canonical === "#/" && (hash === "#" || hash === "#/"))) {
    try { history.replaceState(null, "", canonical); } catch (e) { return; }
    lastAppliedHash = canonical;
  }
}

function syncUrl(beforeKey, mode) {
  if (applyingUrl) return;
  const next = stateToUrl();
  if (next === (location.hash || "#/")) return;
  const push = mode ? mode === "push" : pageKey() !== beforeKey;
  try {
    history[push ? "pushState" : "replaceState"](null, "", next);
  } catch (e) {
    return;   // a sandboxed frame may refuse; the page still works without it
  }
  lastAppliedHash = next;
  companyPushed = state.route === "company" && (push || companyPushed);
}

/* Close returns to the list by going Back when the company page was ours to
   push — the browser then restores the list's URL exactly, filters and all.
   Arriving on a company from a shared link there is nothing of ours to go back
   to, so it replaces the entry with the list instead of leaving the site. */
function closeCompany() {
  if (companyPushed) {
    companyPushed = false;
    history.back();
    return;
  }
  set({ route: state.backRoute || "screener", selected:null }, { history:"replace" });
}

/* --- dom helpers --- */
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "style") n.style.cssText = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid);
  return n;
}
const svgEl = (tag, attrs) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};
const byId = id => document.getElementById(id);

/* --- accessibility helpers --- */

/* A figure that could not be proven. The eye gets an en dash, a screen reader
   gets "not proven" — which is what a blank means here, and which "dash"
   does not say. */
const blank = () => [el("span", { class:"nil", "aria-hidden":"true", text:"–" }),
                      el("span", { class:"sr", text:"not proven" })];

/* Polite announcements, debounced: typing "viva" should be heard once as
   "3 companies", not four times on the way there. */
let announceTimer = null, lastAnnounced = "";
function announce(text) {
  clearTimeout(announceTimer);
  announceTimer = setTimeout(() => {
    if (!text || text === lastAnnounced) return;
    lastAnnounced = text;
    byId("announce").textContent = text;
  }, 400);
}

/* Focus that survives a re-render.
   render() rebuilds the rail, the page bar and the table on every change, so a
   control activated from the keyboard is destroyed under the user's focus —
   measured: sorting or picking a preset dropped focus to <body>, and the next
   Tab started again from the top of the page. Controls that are rebuilt carry
   `data-fk`, a stable key; after render, focus returns to the element with the
   same key. */
let pendingFocus = null;     // a selector that wins over everything else, once
function focusKeyOf(node) {
  return node && node.dataset ? node.dataset.fk || null : null;
}
function placeFocus(prevKey, pageChanged, returning) {
  const active = document.activeElement;
  const lost = !active || active === document.body || !document.contains(active);
  let target = null;
  if (pendingFocus) {
    target = document.querySelector(pendingFocus);
    pendingFocus = null;
  } else if (returning) {
    /* Back from a company: to the row it was opened from. */
    target = document.querySelector("#gridBody tr.cur a.rowlink");
  } else if (lost && prevKey) {
    target = document.querySelector('[data-fk="' + CSS.escape(prevKey) + '"]');
  }
  if (!target && lost && pageChanged) {
    /* A new page whose trigger is gone: to its heading, so a screen reader
       announces where the reader has landed. */
    target = byId(state.route === "company" ? "coHeading" : "pageTitle");
  }
  if (target) target.focus({ preventScroll:true });
  return target;
}

/* A row's own link, opening its company through set() so the history entry,
   back-route and focus are handled — unless a modifier or middle button asks
   for a new tab, which the real href then provides. */
function openOnClick(open) {
  return e => {
    if (e.defaultPrevented || e.button || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    open();
  };
}

/* The href a view would have, for links that should open in a new tab. */
function hrefFor(patch) {
  const saved = Object.assign({}, state);
  Object.assign(state, patch);
  try { return stateToUrl(); } finally { Object.assign(state, saved); }
}

/* --- selection --- */
function universe() {
  const needle = state.q.trim().toLowerCase();
  return DATA.filter(r => {
    if (state.sector && r.s !== state.sector) return false;
    if (!state.includeUnmatched && r.u) return false;
    if (!needle) return true;
    return [r.n, r.ln, r.c, r.s].some(v => v && v.toLowerCase().includes(needle));
  });
}
const provenCount = (pool, k) => pool.filter(r => r[k] != null).length;

/* One company as it stood in one fiscal year.
   Identity comes from the company, every figure from that year alone. A company
   that did not file for the year is absent rather than carried forward — the
   whole point of the view is that no two rows are from different years. */
function yearRow(r, year) {
  const entry = r.fy[String(year)];
  if (!entry) return null;
  const row = { id:r.id, n:r.n, ln:r.ln, s:r.s, c:r.c, e:r.e, u:r.u, ny:r.ny, y:year };
  Object.assign(row, entry);
  /* History and trend stop at the year on the row, so the sparkline does not
     run past the figures beside it. */
  row.h = (r.h || []).filter(p => p[0] <= year);
  const revs = row.h.filter(p => p[1] != null && p[1] > 0);
  if (revs.length >= 3) {
    const first = revs[0], last = revs[revs.length - 1];
    const span = last[0] - first[0];
    if (span > 0) {
      row.cagr = Math.round(1000 * (Math.pow(last[1] / first[1], 1 / span) - 1)) / 10;
    }
  }
  return row;
}

/* The rows a view screens over: companies at their own headline year, or every
   company that filed for one chosen year. */
function pool() {
  const base = universe();
  if (state.route !== "latest") return base;
  return base.map(r => yearRow(r, state.year)).filter(Boolean);
}

function screened(pool) {
  /* Evaluable: has a proven value for every screened metric. A company with no
     value was never a candidate, so results are reported against this set and
     not the whole list. */
  const evaluable = pool.filter(r => state.active.every(c => r[c.k] != null));
  const rows = evaluable.filter(r =>
    state.active.every(c => c.op === "ge" ? r[c.k] >= c.v : r[c.k] <= c.v));
  const key = state.sortKey, asc = state.sortAsc;
  rows.sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    const cmp = typeof x === "string" ? x.localeCompare(y) : x - y;
    return asc ? cmp : -cmp;
  });
  return { evaluable, rows };
}

function addCriterion() {
  const v = parseFloat(state.critValue);
  if (Number.isNaN(v)) { const f = byId("critValue"); if (f) f.focus(); return; }
  const k = state.critMetric, op = state.critOp;
  const next = state.active.filter(c => !(c.k === k && c.op === op));
  next.push({ k, op, v });
  set({ active:next, critValue:"", preset:null, cursor:0, rowLimit:100 });
}

function copyResults(rows, cols) {
  const keep = cols.filter(c => c.kind !== "spark");
  const head = ["Company"].concat(keep.map(c => c.label)).join("\t");
  const lines = rows.map(r => [r.n].concat(keep.map(c => {
    const v = r[c.k];
    if (v == null) return "";
    return typeof v === "number" ? String(v) : String(v).replace(/\s+/g, " ");
  })).join("\t"));
  const text = [head].concat(lines).join("\n");
  const done = n => set({ copyStatus:fmt.format(n) + " rows copied to clipboard" });
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => done(rows.length))
      .catch(() => set({ copyStatus:"clipboard refused — blocked in this frame" }));
  } else set({ copyStatus:"clipboard unavailable" });
}

/* --- keyboard ---
   An analyst working a list of 800 companies should never have to go back to
   the mouse to walk it. */
function onKey(e) {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "select" || tag === "textarea";
  if (e.key === "/" && !typing) { e.preventDefault(); byId("q").focus(); return; }
  if (e.key === "Escape") {
    if (typing) { e.target.blur(); return; }
    if (state.route === "company") closeCompany();
    return;
  }
  if (typing) return;
  if (state.route === "company") {
    if (e.key === "[") stepCompany(-1);
    if (e.key === "]") stepCompany(1);
    return;
  }
  if (state.route !== "screener" && state.route !== "latest") return;
  /* j/k and Tab are one cursor: moving with j/k moves real focus too, so the
     ring, the highlight and what Enter opens are always the same row. */
  const focusCursor = () => {
    const link = document.querySelector("#gridBody tr.cur a.rowlink");
    if (link) link.focus({ preventScroll:true });
  };
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveCursor(1); focusCursor(); }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveCursor(-1); focusCursor(); }
  /* Enter on a link or button is that control's own business; handling it
     here as well opened the cursor row on top of whatever was activated. */
  if (e.key === "Enter" && !e.target.closest("a, button") && lastRows[state.cursor]) {
    set({ route:"company", selected:lastRows[state.cursor].id });
  }
}

/* The cursor moves far more often than anything else changes, so it repaints
   two rows rather than rebuilding a table of a hundred. */
function paintCursor(next) {
  const body = byId("gridBody");
  if (!body) return null;
  const prev = body.querySelector("tr.cur");
  if (prev) prev.classList.remove("cur");
  const row = body.children[next];
  if (row) row.classList.add("cur");
  return row;
}

function moveCursor(d) {
  const max = Math.min(lastRows.length, state.rowLimit) - 1;
  if (max < 0) return;
  const next = Math.max(0, Math.min(max, state.cursor + d));
  state.cursor = next;
  const row = paintCursor(next);
  const box = byId("scroll");
  if (!row || !box) return;
  const top = row.offsetTop, bottom = top + row.offsetHeight;
  const headroom = 56;  /* the two sticky header rows */
  if (top - headroom < box.scrollTop) box.scrollTop = Math.max(0, top - headroom);
  else if (bottom > box.scrollTop + box.clientHeight) box.scrollTop = bottom - box.clientHeight;
}

function stepCompany(d) {
  const i = lastRows.findIndex(r => r.id === state.selected);
  const next = lastRows[i + d];
  /* Stepping through companies replaces the history entry: Back should return
     to the list, not replay every company walked past on the way. */
  if (next) set({ selected:next.id, cursor:i + d }, { history:"replace" });
}

/* --- provenance ---
   Every published figure knows the page of the filing it was read from: each
   `src` entry carries [filing year, file, income-statement page, balance-sheet
   page], and each year's `si` says which entry supplied [revenue, net profit,
   total assets, equity] — a single index when one filing supplied all four,
   a list for the years that draw on two.

   "It's in this 30-page PDF" asks the reader to take it on trust; "it's on page
   8" lets them check in one click. That difference is the whole of what this
   page has that a data vendor does not. */
const LINKED = { rev:0, np:1, ta:2, te:3 };
const INCOME = new Set(["rev", "np"]);

function sourceOf(r, year, key) {
  const e = r.fy && r.fy[String(year)];
  if (!e || e[key] == null || !(key in LINKED)) return null;
  const idx = Array.isArray(e.si) ? e.si[LINKED[key]] : e.si;
  const s = idx != null && idx >= 0 ? (r.src || [])[idx] : null;
  if (!s) return null;
  const page = INCOME.has(key) ? s[2] : s[3];
  return { href: PDF_BASE + s[1] + ".pdf" + (page ? "#page=" + page : ""),
           page: page || null, filingYear: s[0],
           statement: INCOME.has(key) ? "income statement" : "balance sheet" };
}

/* A comparative-column figure points at the NEXT year's filing — FY 2023 read
   from the FY 2024 statement's prior-year column — which looks like a mistake
   unless the link says so. And PDF page numbers count every page of the file,
   cover included, so they run ahead of the number printed in the footer. */
function sourceTitle(s, year) {
  return "Read from the " + s.statement
    + (s.page ? " on page " + s.page + " of the PDF" : "")
    + " — the FY " + s.filingYear + " filing"
    + (s.filingYear !== year ? ", in its prior-year column" : "")
    + ". Opens the audited statement.";
}

function figLink(r, year, key, text, color) {
  const s = sourceOf(r, year, key);
  const style = "color:" + color;
  if (!s) return el("span", { style, text });
  return el("a", { class:"fig", href:s.href, target:"_blank", rel:"noopener noreferrer",
                   style, title:sourceTitle(s, year), text });
}

/* --- charts --- */
function barChart(points, diverging, linkFor) {
  /* Bars, not a line: companies skip years, and a line would draw straight
     through a gap and assert a value that was never filed. */
  const W = 280, H = 74, PAD_T = 4, PAD_B = 4;
  const svg = svgEl("svg", { viewBox:"0 0 " + W + " " + H, role:"img" });
  const values = points.map(p => p[1]);
  const hi = Math.max(0, ...values), lo = Math.min(0, ...values);
  const span = (hi - lo) || 1;
  const plotH = H - PAD_T - PAD_B;
  const y = v => PAD_T + (hi - v) / span * plotH;
  const zero = y(0);
  const step = W / points.length;
  const bw = Math.max(3, step - 4);
  svg.append(svgEl("line", { x1:0, x2:W, y1:zero, y2:zero,
                             stroke:"#c8c8c8", "stroke-width":1 }));
  points.forEach((p, i) => {
    const rect = svgEl("rect", {
      x: i * step + (step - bw) / 2,
      y: p[1] >= 0 ? y(p[1]) : zero,
      width: bw, height: Math.max(1.5, Math.abs(zero - y(p[1]))),
      fill: diverging && p[1] < 0 ? SERIES_NEG
          : i === points.length - 1 ? INK : SERIES,
    });
    const t = svgEl("title", {});
    const s = linkFor ? linkFor(p[0]) : null;
    t.textContent = p[0] + "  €" + fmt.format(p[1])
      + (s ? "\n" + sourceTitle(s, p[0]) : "");
    rect.append(t);
    if (s) {
      /* Each bar opens the page its figure was read from, same as the table. */
      const a = svgEl("a", { href:s.href, target:"_blank", rel:"noopener noreferrer",
                             class:"figbar" });
      a.append(rect);
      svg.append(a);
    } else {
      svg.append(rect);
    }
  });
  return svg;
}

function chartBlock(title, points, diverging, linkFor) {
  const head = el("div", { class:"charthead" }, el("h3", { class:"cap", text:title }));
  const box = el("div", { class:"chart" }, head);
  if (!points.length) {
    head.append(el("span", { class:"last", style:"color:" + MUTED, text:"not proven" }));
    return box;
  }
  const last = points[points.length - 1];
  head.append(el("span", { class:"last",
    text:"€" + compact(last[1]) + " · " + last[0] }));
  const svg = barChart(points, diverging, linkFor);
  /* A chart is one image to a screen reader, so its name carries every bar.
     The bars are links for the mouse; the year-by-year table carries the same
     links for the keyboard, so the bars are kept out of the Tab order rather
     than adding up to eleven unlabelled stops per chart. */
  svg.setAttribute("aria-label", title + " by year: "
    + points.map(p => p[0] + " €" + compact(p[1])).join(", "));
  svg.querySelectorAll("a").forEach(a => a.setAttribute("tabindex", "-1"));
  box.append(svg);
  box.append(el("div", { class:"chartyrs", "aria-hidden":"true" },
    el("span", { text:String(points[0][0]) }),
    el("span", { text: points.length > 1 ? String(last[0]) : "" })));
  return box;
}

function sparkline(points) {
  const vals = points.map(p => p[1]);
  const hi = Math.max(...vals), lo = Math.min(...vals), span = (hi - lo) || 1;
  const x = i => (i / (points.length - 1)) * 58 + 1;
  const y = v => 14 - ((v - lo) / span) * 12;
  const svg = svgEl("svg", { viewBox:"0 0 60 16", preserveAspectRatio:"none",
                             role:"img", class:"spark" });
  svg.append(svgEl("polyline", {
    points: points.map((p, i) => x(i).toFixed(1) + "," + y(p[1]).toFixed(1)).join(" "),
    fill:"none", stroke:SERIES, "stroke-width":1.25, "stroke-linejoin":"round" }));
  svg.append(svgEl("circle", { cx:x(points.length - 1).toFixed(1),
                               cy:y(vals[vals.length - 1]).toFixed(1), r:1.9, fill:INK }));
  return svg;
}

/* --- header, rail --- */
function renderChrome(pool) {
  const years = DATA.map(r => r.y).filter(Boolean);
  const stats = byId("topstats");
  stats.replaceChildren();
  const rows = [
    ["Companies", fmt.format(DATA.length)],
    ["Company-years", fmt.format(DATA.reduce((n, r) => n + (r.h ? r.h.length : 0), 0))],
    ["Years", years.length ? Math.min.apply(null, years) + "–"
                             + Math.max.apply(null, years) : "—"],
  ];
  for (const s of rows) {
    stats.append(el("div", {}, el("b", { text:s[1] }), el("span", { text:s[0] })));
  }

  const nav = byId("nav");
  nav.replaceChildren();
  const uni = universe();
  const filed = uni.filter(r => r.fy[String(state.year)]).length;
  const items = [
    ["pulse", "Pulse", ""],
    ["screener", "Screener", fmt.format(uni.length)],
    ["latest", "By fiscal year", fmt.format(filed)],
    ["sectors", "Sectors", String(Object.keys(SECTORS).length)],
    ["movers", "Movers", ""],
    ["quality", "Data quality", ""],
  ];
  for (const item of items) {
    const id = item[0];
    const on = state.route === id
      || (state.route === "company" && id === (state.backRoute || "screener"));
    nav.append(el("button", { class:"navbtn", type:"button", "data-fk":"nav:" + id,
      "aria-current": on ? "page" : null,
      onClick: () => set({ route:id, selected:null }) },
      el("span", { class:"navmark", "aria-hidden":"true" }),
      el("span", { text:item[1] }),
      /* "Screener660" read as one word otherwise. */
      item[2] ? el("span", { class:"navbadge" }, el("span", { class:"sr", text:", " }),
                   el("span", { text:item[2] })) : null));
  }

  const q = byId("q");
  if (q.value !== state.q) q.value = state.q;
  const sel = byId("sector");
  if (!sel.options.length) {
    sel.append(el("option", { value:"", text:"All sectors" }));
    const names = Array.from(new Set(DATA.map(r => r.s).filter(Boolean))).sort();
    for (const s of names) {
      sel.append(el("option", { value:s, text: s.length > 40 ? s.slice(0, 40) + "…" : s }));
    }
  }
  sel.value = state.sector;
  byId("unmatched").checked = state.includeUnmatched;

  const presets = byId("presets");
  presets.replaceChildren();
  for (const p of PRESETS) {
    presets.append(el("button", { class:"preset", type:"button", "data-fk":"preset:" + p.id,
      "aria-pressed": String(state.preset === p.id),
      onClick: () => set({ preset:p.id, active:p.crit.slice(), view:p.view,
                           sortKey:DEFAULT_SORT[p.view], sortAsc:false,
                           route:"screener", cursor:0, rowLimit:100 }) },
      el("b", { text:p.label }), el("span", { text:p.hint })));
  }

  /* Coverage in the picker: return on equity applies to a quarter of the list,
     and offering it unqualified invites the wrong conclusion. */
  const metric = byId("critMetric");
  metric.replaceChildren();
  for (const c of CRITERIA) {
    const n = provenCount(pool, c.k);
    metric.append(el("option", { value:c.k, disabled: n === 0,
      selected: state.critMetric === c.k,
      text: c.label + (c.unit ? " (" + c.unit + ")" : "") + "  ·  " + fmt.format(n) }));
  }
  metric.value = state.critMetric;
  byId("critOp").value = state.critOp;
  const critSpec = CRITERIA.find(c => c.k === state.critMetric) || CRITERIA[0];
  const valField = byId("critValue");
  valField.value = state.critValue;
  valField.placeholder = critSpec.unit === "€" ? "€ value"
    : critSpec.unit === "%" ? "percent" : critSpec.unit ? critSpec.unit : "value";

  const chips = byId("chips");
  chips.replaceChildren();
  state.active.forEach((c, i) => {
    const spec = CRITERIA.find(x => x.k === c.k);
    const shownV = spec.unit === "€" ? "€" + fmt.format(c.v)
      : fmt.format(c.v) + spec.unit;
    chips.append(el("span", { class:"chip" },
      el("span", { text: spec.label + " " + (c.op === "ge" ? "≥ " : "≤ ") + shownV }),
      el("button", { type:"button", text:"×",
        "aria-label":"Remove criterion " + spec.label + " " + (c.op === "ge" ? "at least " : "at most ")
                      + shownV,
        onClick: () => {
          const next = state.active.slice(); next.splice(i, 1);
          /* The removed chip's button is gone; focus goes to the next chip's
             remove button, or to the criterion builder when none are left. */
          pendingFocus = next.length ? "#chips .chip:nth-child(" + Math.min(i + 1, next.length)
                                       + ") button" : "#critMetric";
          set({ active:next, preset:null, cursor:0 });
        } })));
  });
}

function renderPagebar(rows, sc, shown, cols) {
  const grid = state.route === "screener" || state.route === "latest";
  byId("pageTitle").textContent = state.route === "latest"
    ? "FY " + state.year : TITLES[state.route];
  const missing = grid ? rows.length - sc.evaluable.length : 0;
  byId("resultLine").textContent = state.route === "pulse" && PULSE
    ? "Registry " + longDate(PULSE.snapshot) + "  ·  latest audited filing "
      + longDate(PULSE.latestFiling)
    : grid
    ? (state.active.length
        ? fmt.format(sc.rows.length) + " of " + fmt.format(sc.evaluable.length) + " screenable"
        : fmt.format(rows.length) + (state.route === "latest"
            ? " companies filed" : (rows.length === DATA.length ? " companies"
                : " of " + fmt.format(DATA.length) + " companies")))
    : "";
  byId("warnLine").textContent = grid && state.active.length && missing
    ? fmt.format(missing) + " lack a proven value and were not assessed" : "";

  const acts = byId("pageActions");
  acts.replaceChildren();
  if (!grid) return;
  if (state.route === "latest") {
    /* Each year carries how many companies filed for it. Choosing a year
       blind is choosing how much of the list to throw away, and the most
       recent year is not the fullest one. */
    const uni = universe();
    const pick = el("select", { class:"yearsel", "aria-label":"Fiscal year", "data-fk":"year",
      onChange: e => set({ year:Number(e.target.value), cursor:0, rowLimit:100 }) });
    for (const y of YEARS) {
      const n = uni.filter(r => r.fy[String(y)]).length;
      pick.append(el("option", { value:String(y), selected: y === state.year,
        text:"FY " + y + "  ·  " + fmt.format(n) }));
    }
    pick.value = String(state.year);
    acts.append(pick);
  }
  const tabs = el("div", { class:"tabs", role:"group", "aria-label":"Choose columns" });
  for (const v of [["figures","Figures"], ["ratios","Ratios"], ["cash","Cash flow"]]) {
    tabs.append(el("button", { type:"button", text:v[1], "data-fk":"view:" + v[0],
      "aria-pressed": String(state.view === v[0]),
      onClick: () => set({ view:v[0], sortKey:DEFAULT_SORT[v[0]], sortAsc:false,
                           route: state.route === "latest" ? "latest" : "screener",
                           cursor:0 }) }));
  }
  acts.append(tabs);
  acts.append(el("button", { class:"btn", type:"button", text:"Copy", "data-fk":"copy",
    "aria-label":"Copy the rows on screen",
    title:"Copy the rows on screen as tab-separated text",
    onClick: () => copyResults(shown, cols) }));
}

function renderFooter(sc) {
  const years = DATA.map(r => r.y).filter(Boolean);
  byId("statusCount").textContent =
    state.route === "screener" || state.route === "latest"
      ? fmt.format(sc.rows.length) + " rows" : TITLES[state.route];
  byId("statusScreen").textContent = state.copyStatus || (state.active.length
    ? state.active.length + (state.active.length === 1 ? " criterion" : " criteria") + " active"
    : (state.preset ? "" : "no criteria"));
  byId("statusKeys").textContent = state.route === "company"
    ? "[  ]  step company    esc  close"
    : state.route === "screener" || state.route === "latest"
      ? "/  search    j k  move    enter  open" : "/  search";
  byId("statusVintage").textContent = years.length
    ? "FY " + Math.max.apply(null, years) + " latest" : "";
}

/* --- screener --- */
function cellFor(r, col, barMax) {
  if (col.kind === "spark") {
    const pts = (r.h || []).filter(p => p[1] != null);
    if (pts.length < 2) {
      return el("td", { class:"txt" }, el("span", { class:"nil", "aria-hidden":"true", text:"–" }),
                el("span", { class:"sr", text:"fewer than two years of revenue" }));
    }
    const trend = "Revenue " + pts.map(p => p[0] + " €" + compact(p[1])).join(", ");
    const td = el("td", { class:"txt", title: trend });
    const svg = sparkline(pts);
    svg.setAttribute("aria-label", trend);
    td.append(svg);
    return td;
  }
  if (col.kind === "text") {
    /* Sector names run to 60 characters; left to wrap they turn a dense table
       into five-line rows. Truncated, with the full text on hover. */
    const v = r[col.k];
    return v ? el("td", { class:"txt", title:v, style:"color:" + SECOND, text:v })
             : el("td", { class:"txt" }, el("span", { class:"nil", "aria-hidden":"true", text:"–" }),
                  el("span", { class:"sr", text:"not recorded" }));
  }
  if (col.kind === "year") {
    return el("td", { style:"color:" + SECOND, text:String(r.y) });
  }
  const v = r[col.k];
  if (v == null) return el("td", {}, blank());
  /* Levels stay black; only a change carries a direction worth colouring. */
  const color = col.delta ? (v > 0 ? POS : v < 0 ? NEG : MUTED)
              : (col.sign && v < 0 ? NEG : INK);
  const td = el("td", { style:"color:" + color, title: COL_TITLES[col.k] || null },
    el("span", { text:col.f(v) }));
  /* A data bar in the revenue column turns the list into a shape: which rows
     carry the scale is legible without reading a single figure. */
  if (col.bar && OPTS.dataBars && v > 0) {
    td.append(el("span", { class:"databar", "aria-hidden":"true" },
      el("span", { style:"width:" + Math.max(1, v / barMax * 100).toFixed(1) + "%" })));
  }
  return td;
}

function allColumnLabel(cols, key) {
  const c = [{ k:"n", label:"Company" }].concat(cols).find(c => c.k === key);
  return c ? (c.kind === "spark" ? "revenue trend" : c.label) : key;
}

function renderScreener(sc, shown, cols, rows) {
  const wrap = el("div");
  if (state.route === "latest") {
    const filed = rows.length;
    /* Measured over what is in view, like every other count on the page — a
       best year drawn from the whole payload would contradict the same figure
       on the data-quality page the moment a filter is on. */
    const uni = universe();
    const best = YEARS.reduce((a, y) => {
      const n = uni.filter(r => r.fy[String(y)] && r.fy[String(y)].rev != null).length;
      return n > a.n ? { y, n } : a;
    }, { y:state.year, n:0 });
    wrap.append(el("p", { class:"lede",
      text:"Every company that filed for FY " + state.year + ", on that year alone — "
         + fmt.format(filed) + " of the " + fmt.format(uni.length)
         + " in view. The screener shows each "
         + "company at its own best-covered recent year, so two of its rows can be years "
         + "apart; here they cannot. A company missing from this list did not file for FY "
         + state.year + " — not that it has no figures at all. And the most recent year is "
         + "not the best-covered one: FY " + best.y + " carries the most companies with "
         + "proven revenue." }));
  }
  const barMax = Math.max(1, ...shown.map(r => r.rev || 0));
  const key = state.sortKey, asc = state.sortAsc;

  /* A pinned cell pins its whole width, so the pinned group cell may span only
     the columns the body actually pins - rank and company. Everything else
     scrolls, or one group label ends up sitting over another group's figures. */
  const groups = [{ label:"Company", span:2, pinned:true }];
  for (const c of cols) {
    const last = groups[groups.length - 1];
    if (last && !last.pinned && last.label === c.g) last.span += 1;
    else groups.push({ label:c.g, span:1 });
  }

  const table = el("table", { class:"grid" });
  /* The caption says what the table is and how it is ordered — the first thing a
     screen reader reads on entering it, and invisible otherwise. */
  const sortCol = allColumnLabel(cols, key);
  table.append(el("caption", { class:"sr",
    text:(state.route === "latest" ? "Companies that filed for FY " + state.year : "Companies")
       + ", sorted by " + sortCol + (asc ? ", ascending" : ", descending") + ". "
       + fmt.format(shown.length) + " shown of " + fmt.format(sc.rows.length)
       + ". Each company name opens its page." }));
  const groupRow = el("tr", { class:"grouprow" });
  groups.forEach(g => groupRow.append(el("th", { scope:"colgroup",
    colspan:String(g.span), class: g.pinned ? "pin pin-group" : null, text:g.label })));

  /* The rank column is a real column in the body, so it needs a real header
     cell - without one every label sits one column left of its figures. */
  const colRow = el("tr", { class:"colrow" });
  const allCols = [{ k:"rank", label:"#", rank:true },
                   { k:"n", label:"Company", identity:true }].concat(cols);
  allCols.forEach((col, i) => {
    const right = col.rank || col.f || col.kind === "year";
    const cls = [i === 0 ? "pin pin-rank" : i === 1 ? "pin pin-name" : null,
                 right ? "r" : "l"].filter(Boolean).join(" ");
    const th = el("th", { class:cls, scope:"col" });
    if (col.k === key) th.setAttribute("aria-sort", asc ? "ascending" : "descending");
    th.append(el("button", { type:"button", text:col.label, "data-fk":"sort:" + col.k,
      /* Kept as the plain column name: a header button's name is what a screen
         reader repeats before every cell in the column, so "Sort by Revenue"
         would be read a hundred times. aria-sort on the th says it sorts. Only
         the two whose visible label misleads are renamed. */
      "aria-label": col.rank ? "Rank" : col.kind === "spark" ? "Revenue trend" : null,
      title: col.rank ? "Position in the current sort" : (COL_TITLES[col.k] || null),
      onClick: () => {
        if (col.rank) set({ sortKey:DEFAULT_SORT[state.view], sortAsc:false, cursor:0 });
        else if (col.k === key) set({ sortAsc:!asc, cursor:0 });
        else set({ sortKey:col.k, sortAsc:!(col.f || col.kind === "year"), cursor:0 });
      } }));
    colRow.append(th);
  });
  table.append(el("thead", {}, groupRow, colRow));

  const tbody = el("tbody", { id:"gridBody" });
  shown.forEach((r, i) => {
    const open = () => set({ route:"company", selected:r.id, cursor:i });
    const tr = el("tr", { class: i === state.cursor ? "cur" : null,
      /* Anywhere on the row opens the company for a mouse; the name's own link
         handles itself, so a click on it is not handled twice. */
      onClick: e => { if (!e.target.closest("a")) open(); },
      onMouseenter: () => { if (state.cursor !== i) { state.cursor = i; paintCursor(i); } } });
    tr.append(el("td", { class:"pin pin-rank", text:String(i + 1) }));
    /* A filer whose folded name matches a registry-matched company says so
       ahead of its legal name: that a row may be the same business as another
       row on the page outranks what it calls itself. */
    const sub = r.tw ? "also filed as “" + r.tw + "”"
              : (r.ln && r.ln !== r.n ? r.ln
              : (r.u ? "not matched to the business registry" : (r.c || "")));
    const unregOnly = r.u && !r.tw && !(r.ln && r.ln !== r.n);
    tr.append(el("th", { class:"pin pin-name", scope:"row",
      title: r.tw ? r.n + "  —  a registry-matched filer also files as “" + r.tw
                    + "”" + (r.twy ? ", including FY " + r.twy.join(", FY ") : "")
                  : r.n },
      el("a", { class:"rowlink", href:"#/company/" + enc(r.id), "data-fk":"row:" + r.id,
                onClick: openOnClick(open),
                /* Tab and j/k are one cursor: reaching a row by Tab moves it. */
                onFocus: () => { if (state.cursor !== i) { state.cursor = i; paintCursor(i); } } },
        el("span", { class:"coname", text:r.n }),
        sub ? el("span", { class:"cosub" + (unregOnly ? " unreg" : ""), text:sub }) : null)));
    for (const col of cols) tr.append(cellFor(r, col, barMax));
    tbody.append(tr);
  });
  table.append(tbody);
  wrap.append(table);

  if (sc.rows.length > shown.length) {
    wrap.append(el("button", { class:"more", type:"button",
      text:"Show " + fmt.format(Math.min(100, sc.rows.length - shown.length)) + " more  ·  "
         + fmt.format(shown.length) + " of " + fmt.format(sc.rows.length),
      onClick: () => {
        /* Continue from the first new row, not from the button that has now
           moved a hundred rows down the page. */
        const first = shown.length;
        pendingFocus = "#gridBody tr:nth-child(" + (first + 1) + ") a.rowlink";
        set({ rowLimit: state.rowLimit + 100, cursor:first });
      } }));
  }
  if (!shown.length) {
    wrap.append(el("div", { class:"empty",
      text:"No company meets all of these criteria. Loosen a threshold, or remove one — "
         + "a company with no proven value for a screened metric cannot qualify." }));
  }
  wrap.append(el("p", { class:"foot",
    text:"Only figures an arithmetic identity could prove are shown. A blank cell means the "
       + "figure could not be proven, not that it is zero. Screening excludes companies with "
       + "no proven value for the metric being screened; criteria combine with AND." }));
  return wrap;
}

/* --- company --- */
function renderCompany() {
  const r = DATA.find(x => x.id === state.selected);
  const wrap = el("div", { style:"padding:0 0 32px;" });
  const back = closeCompany;
  if (!r) { wrap.append(el("div", { class:"empty", text:"Company not found." })); return wrap; }

  const meta = [r.ln && r.ln !== r.n ? r.ln : null, r.s, r.c,
                r.e != null ? fmt.format(r.e) + " staff (ARBK)" : null,
                r.ny ? r.ny + " filings read" : null,
                r.u ? "not matched to the business registry" : null]
    .filter(Boolean).join("   ·   ");
  const twinNote = r.tw
    ? "A registry-matched filer files under the same name once spelling and legal form "
      + "are set aside: “" + r.tw + "”."
      + (r.twy
          ? " Both publish FY " + r.twy.join(", FY ") + ", so those years appear twice on "
            + "the screener when unmatched filers are included, read from two different "
            + "filings."
          : " Their filed years do not overlap, so one company's history may be split "
            + "across the two rows.")
      + " They are shown separately because a name is not proof of identity — a wrong "
      + "merge loses a company, where a duplicate only repeats one."
    : null;
  wrap.append(el("div", { class:"cohead" },
    el("div", { style:"min-width:0;" },
      el("h2", { id:"coHeading", tabindex:"-1", text:r.n }),
      el("div", { class:"cometa", text:meta }),
      twinNote ? el("div", { class:"twinnote", text:twinNote }) : null),
    el("div", { class:"coacts" },
      el("span", { class:"yrbadge", text:"FY " + r.y }),
      el("button", { class:"btn", type:"button", text:"←", "data-fk":"co:prev",
        "aria-label":"Previous company", "aria-keyshortcuts":"[",
        title:"Previous company  ·  [", onClick: () => stepCompany(-1) }),
      el("button", { class:"btn", type:"button", text:"→", "data-fk":"co:next",
        "aria-label":"Next company", "aria-keyshortcuts":"]",
        title:"Next company  ·  ]", onClick: () => stepCompany(1) }),
      el("button", { class:"btn", type:"button", text:"Close", "data-fk":"co:close",
        "aria-keyshortcuts":"Escape",
        title:"Back to the screener  ·  Esc", onClick: back }))));

  const kpis = el("div", { class:"kpis" });
  /* [label, text, colour, linked field] — the read figures open their page;
     growth, margin and CAGR are computed from them, so they have no page. */
  const kpiRows = [
    ["Revenue", r.rev == null ? "—" : "€" + compact(r.rev), INK, "rev"],
    ["Growth", signed(r.g) || "—", r.g == null ? FAINT : r.g < 0 ? NEG : POS],
    ["Net profit", r.np == null ? "—" : "€" + compact(r.np),
     r.np != null && r.np < 0 ? NEG : INK, "np"],
    ["Net margin", pct(r.nm) || "—", r.nm != null && r.nm < 0 ? NEG : INK],
    ["Total assets", r.ta == null ? "—" : "€" + compact(r.ta), INK, "ta"],
    ["Revenue CAGR", signed(r.cagr) || "—",
     r.cagr == null ? FAINT : r.cagr < 0 ? NEG : POS],
  ];
  for (const k of kpiRows) kpis.append(el("div", {},
    el("div", { class:"cap", text:k[0] }),
    el("b", {}, k[3] && r[k[3]] != null ? figLink(r, r.y, k[3], k[1], k[2])
                                        : k[1] === "—" ? blank()
                                        : el("span", { style:"color:" + k[2], text:k[1] }))));
  wrap.append(kpis);

  const hist = r.h || [];
  const series = i => hist.filter(p => p[i] != null).map(p => [p[0], p[i]]);
  wrap.append(el("div", { class:"panelrow" },
    chartBlock("Revenue", series(1), false, y => sourceOf(r, y, "rev")),
    chartBlock("Net profit", series(2), true, y => sourceOf(r, y, "np")),
    chartBlock("Total assets", series(3), false, y => sourceOf(r, y, "ta"))));

  const bench = SECTORS[r.s];
  const ratioPanel = el("div", { class:"panel" },
    el("h3", { class:"cap", id:"ratioHead",
               text: bench ? "Ratios against sector median" : "Ratios" }));
  const rtable = el("table", { class:"flat", "aria-labelledby":"ratioHead" });
  rtable.append(el("thead", {}, el("tr", {},
    el("th", { class:"l", text:"" }), el("th", { text:"Company" }),
    el("th", { text:"Sector median" }))));
  const rbody = el("tbody");
  for (const row of RATIO_ROWS) {
    const k = row[1], f = row[2];
    if (r[k] == null) continue;
    rbody.append(el("tr", {},
      el("td", { class:"l", text:row[0] }),
      el("td", { style:"color:" + (r[k] < 0 ? NEG : INK), text:f(r[k]) }),
      el("td", { style:"color:" + MUTED,
        title: bench && bench.n && bench.n[k] != null
          ? "median of " + bench.n[k] + " companies" : null,
      }, bench && bench.med[k] != null ? f(bench.med[k])
          : [el("span", { class:"nil", "aria-hidden":"true", text:"–" }),
             el("span", { class:"sr", text:"no sector median" })])));
  }
  rtable.append(rbody);
  ratioPanel.append(rtable);
  ratioPanel.append(el("p", { class:"note", text: bench
    ? "Sector medians drawn from the companies in " + r.s + " with each ratio proven, of "
      + bench.companies + " in the sector."
    : "No sector benchmark: this filer is not matched to a registry sector." }));

  const histPanel = el("div", { class:"panel" },
    el("h3", { class:"cap", id:"histHead", text:"Year by year" }));
  const htable = el("table", { class:"flat", "aria-labelledby":"histHead" });
  htable.append(el("thead", {}, el("tr", {},
    el("th", { class:"l", text:"Year" }), el("th", { text:"Revenue" }),
    el("th", { text:"Net profit" }), el("th", { text:"Total assets" }))));
  const hbody = el("tbody");
  const HIST_KEYS = [null, "rev", "np", "ta"];
  for (const p of hist) {
    const tr = el("tr");
    p.forEach((v, i) => {
      if (i === 0) { tr.append(el("td", { class:"l", style:"color:" + INK, text:String(v) })); return; }

      tr.append(el("td", {}, v == null

  htable.append(hbody);
  histPanel.append(htable);

    text:"Each figure opens the page of the audited filing it was read from. PDF pages are "
       + "counted from the cover, so they can run a page or two ahead of the number printed "
       + "in the footer. Years a company did not file are absent rather than interpolated, "
       + "so a gap in the record stays a gap." }));

  const src = el("div", { style:"padding:16px 18px 0;" },
    el("h3", { class:"cap", text:"Filings these figures came from" }));

  for (const s of (r.src || [])) perYear[s[0]] = (perYear[s[0]] || 0) + 1;

    }

  src.append(links);
  src.append(el("p", { class:"foot", style:"padding:12px 0 0;",
    text:"The filings whole, as published by the Ministry of Finance. Every figure above "
       + "was read from one of these, links to the page it came from, and was checked "
       + "against the statement's own arithmetic." }));
  wrap.append(src);
  return wrap;
}

/* --- sectors --- */
function renderSectors(pool) {
  const wrap = el("div");
  const cols = [["nm",pct], ["roa",pct], ["roe",pct], ["lev",pct], ["at",mult], ["conv",mult]];
  const rows = Object.keys(SECTORS).map(name => {
    const b = SECTORS[name];
    const revs = pool.filter(r => r.s === name).map(r => r.rev).filter(v => v != null);
    return { name, b, revCount:revs.length, rev: revs.reduce((a, v) => a + v, 0) };
  }).sort((a, b) => b.rev - a.rev);
  const allSectors = new Set(DATA.map(r => r.s).filter(Boolean));

  wrap.append(el("p", { class:"lede",
    text: rows.length + " of " + allSectors.size + " sectors have at least five companies and "
       + "can carry a median — a median of two is not a benchmark. Medians are taken "
       + "across the companies in each sector with the ratio proven. Select a sector to "
       + "screen it." }));

  const table = el("table", { class:"sectors" });
  table.append(el("caption", { class:"sr",
    text:"Sectors by revenue in view, with sector medians. Each sector name opens the "
       + "screener filtered to it." }));
  const head = el("tr");
  const heads = ["Sector", "Companies", "Revenue in view", "Net margin", "ROA", "ROE",
                 "Liab / assets", "Asset turnover", "Cash conv."];
  heads.forEach((h, i) => head.append(el("th", { class: i === 0 ? "first" : null,
                                                 scope:"col", text:h })));
  table.append(el("thead", {}, head));
  const tbody = el("tbody");

                       el("span", { class:"sr", text })];
  for (const row of rows) {
    const open = () => set({ route:"screener", sector:row.name, selected:null,
                             cursor:0, rowLimit:100 });

    tr.append(el("th", { class:"first", scope:"row", title:row.name },
      el("a", { class:"rowlink", "data-fk":"sector:" + row.name,
                href: hrefFor({ route:"screener", sector:row.name, selected:null }),
                onClick: openOnClick(open), text:row.name })));
    tr.append(el("td", { text:fmt.format(row.b.companies) }));
    tr.append(el("td", { style:"color:" + INK },
      row.revCount ? "€" + compact(row.rev) : nil("no revenue in view")));

      const v = row.b.med[c[0]];
      tr.append(el("td", { style:"color:" + (v == null ? FAINT : v < 0 ? NEG : INK),
        title: row.b.n && row.b.n[c[0]] != null

  return wrap;
}

/* --- movers --- */
function renderMovers(pool) {
  const wrap = el("div");
  wrap.append(el("p", { class:"lede",
    text:"Ranked on figures already proven. Companies are excluded unless both the latest and "
       + "the preceding proven year clear €1m — a small base makes any percentage "
       + "large." }));

  const priorRev = r => {
    const revs = (r.h || []).filter(p => p[1] != null);
    return revs.length > 1 ? revs[revs.length - 2][1] : null;
  };
  const base = pool.filter(r => (r.rev || 0) >= 1000000 && (priorRev(r) || 0) >= 1000000);

  const lists = el("div", { class:"moverlists" });
  const specs = [
    ["Fastest growing", "Year-on-year revenue growth", "g", 1, signed],
    ["Steepest decline", "Year-on-year revenue growth", "g", -1, signed],
    ["Best compounders", "Revenue CAGR over proven years", "cagr", 1, signed],
  ];
  for (const spec of specs) {
    const key = spec[2], dir = spec[3], f = spec[4];
    const headId = "mv-" + spec[0].toLowerCase().replace(/[^a-z]+/g, "-");
    const list = el("section", { class:"moverlist", "aria-labelledby":headId },
      el("div", { class:"moverhead" },
        el("h3", { class:"cap", id:headId, text:spec[0] }),
        el("div", { text:spec[1] })));
    const items = base.filter(r => r[key] != null)
      .sort((a, b) => dir * (b[key] - a[key])).slice(0, 12);
    if (!items.length) list.append(el("div", { class:"empty", text:"No company qualifies." }));
    /* An ordered list: the rank is the order, so it is read as one rather than
       repeated as a number in every item. Each company is a real link. */
    const ol = el("ol", { style:"list-style:none;margin:0;padding:0;" });
    items.forEach((r, i) => {
      ol.append(el("li", {}, el("a", { class:"moveritem", href:"#/company/" + enc(r.id),
        "data-fk":"mover:" + spec[0] + ":" + r.id,
        onClick: openOnClick(() => set({ route:"company", selected:r.id })) },
        el("span", { class:"rank", "aria-hidden":"true", text:String(i + 1) }),
        el("span", { class:"nm", title:r.n, text:r.n }),
        el("span", { class:"val", style:"color:" + (r[key] < 0 ? NEG : POS),
                     text:f(r[key]) }))));
    });
    list.append(ol);
    lists.append(list);
  }
  wrap.append(lists);
  return wrap;
}

/* --- data quality --- */
function renderQuality(pool) {
  const wrap = el("div");
  const n = pool.length || 1;
  const unmatched = DATA.filter(r => r.u).length;

  wrap.append(el("p", { class:"lede",
    text:"Coverage across the " + fmt.format(pool.length) + " companies currently in view, of "
       + fmt.format(DATA.length) + " embedded. A field counts as covered only where an "
       + "arithmetic identity proved it, so these shares are the ceiling on what can be "
       + "screened — not a sample." }));

  const head = el("div", { class:"qhead" });
  const headline = [
    ["In view", fmt.format(pool.length)],
    ["Matched to registry", fmt.format(DATA.length - unmatched)],
    ["Unmatched filers, all data", fmt.format(unmatched)],
    ["No ratio provable",
     fmt.format(pool.filter(r => r.nm == null && r.roa == null).length)],

  for (const s of headline) head.append(el("div", {},
    el("b", { text:s[1] }), el("div", { class:"cap", text:s[0] })));
